[project]
name = "file-converter"
# 실제 배포 버전은 packaging/VERSION이 유일한 정본이다(DEC-013,
# app/version.py 참고) — 여기 버전은 uv/패키징 메타데이터용 자리값일 뿐,
# 릴리스 때 갱신하지 않는다.
version = "0.0.0"
description = "오프라인 데스크톱 파일 변환기"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7",
    "openpyxl>=3.1",
    "pdfminer.six>=20231228",
    "python-docx>=1.1",
    "Pillow>=10",
    "pypdfium2>=4",
    "python-pptx>=1.0",
    "trimesh>=4.0",
    "Markdown>=3.10",
    "markdownify>=1.2",
]

[dependency-groups]
dev = ["pyinstaller", "pre-commit", "ruff"]

[tool.uv]
# PyInstaller로 소스를 그대로 번들하는 데스크톱 앱이라 이 프로젝트 자체를
# 패키지로 빌드·설치할 필요가 없다 — 의존성 관리 전용으로만 uv를 쓴다.
package = false
# uv 실행기 자체(uv 바이너리)의 버전을 고정 — CI의 astral-sh/setup-uv는
# `version` 입력이 없으면 이 필드를 자동으로 읽어 설치한다(공식 문서 확인).
# 이걸 안 고정하면 같은 uv.lock으로도 시점에 따라 다른 uv 버전이 빌드 도구로
# 쓰여 재현성이 완전하지 않다(review 지적) — LibreOffice·FFmpeg·JRE처럼
# 이 프로젝트의 다른 빌드 도구·외부 자산을 전부 고정 버전으로 관리하는
# 관례(DEC-064 등)와 동일한 원칙. 갱신 시 로컬 `uv self update` 후 이 값도
# 같이 올릴 것.
required-version = "==0.12.5"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
# E501(줄 길이)은 제외 — 이 프로젝트는 한글 주석·docstring이 근거·배경을
# 상세히 담는 관례라 한 줄이 훨씬 길어지는 경우가 흔하다(문서 성격의
# 서술이 임의로 줄바꿈되면 오히려 읽기 나빠짐). 포맷터(ruff format)도
# 이 줄들을 재줄바꿈하지 않도록 별도 처리하지는 않는다 — 줄 길이는 이
# 프로젝트에서 강제하지 않는 스타일 항목으로 취급한다.
select = ["E", "F", "W", "I"]
ignore = ["E501"]
