name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system libs for Qt (headless)
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1
      - run: pip install -r requirements.txt
      - name: Run tests (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover tests -v

  build-windows:
    # Windows 우선 배포 (REQ-NF-001). HWP 엔진(jlink JRE + hwplib) + LibreOffice(DOCX/HWP→PDF)를
    # dist/engine에 번들 — v0.3a·v0.3b(DEC-007·DEC-012).
    # 빌드·스모크·라이선스 검증은 PR에서도 머지 게이트로 실행하고,
    # 아티팩트 업로드·릴리스 발행은 main/태그/수동 실행으로 제한한다.
    needs: test
    runs-on: windows-latest
    env:
      # 스파이크로 검증된 hwplib 리비전 (spike/hwplib/RESULT.md · DEC-007).
      # 갱신은 별도 PR에서 스파이크/스모크 결과와 함께 진행할 것.
      HWPLIB_REV: d9e073d6899d947f8f583492e00a5e1062381d7e
      # 스파이크로 검증된 hwpxlib 리비전(spike/hwpxlib/RESULT.md, QA(h)
      # Phase 1) — hwplib과 별개 라이브러리(HWPX 지원). 패치 불요.
      HWPXLIB_REV: 473d9d6aa82d8896f4f464b52d801e5691dc7cf3
      # 공식 배포 서버에서 curl로 직접 확인한 SHA256 (DEC-012). 버전 갱신 시
      # download.documentfoundation.org의 <파일명>.sha256을 다시 확인해 갱신할 것.
      LO_VERSION: "26.2.5"
      LO_SHA256: f15ba07bfcb0186986cf3171063506f5d207c11f8cc051ba0d135209e9e915f9
      # Noto Sans KR(OFL-1.1) — 로컬에서 직접 다운로드해 확인한 zip SHA256 (DEC-015).
      # 갱신 시 https://github.com/notofonts/noto-cjk/releases 에서 새 값을 다시 계산할 것.
      NOTOKR_RELEASE_TAG: "Sans2.004"
      NOTOKR_SHA256: ac7eeb4e2b0d41de8ff31b2d6e1e2a41caf253fd5cefb380bfa1f40f1747b612
      # FFmpeg LGPL 빌드(BtbN/FFmpeg-Builds, GPL 전용 라이브러리(libx264 등) 미포함 —
      # DEC-024) — 로컬에서 직접 다운로드해 확인한 zip SHA256. BtbN의 "latest" 릴리스
      # 자산은 LibreOffice 공식 배포와 달리 같은 URL이 주기적으로 재빌드되어 갱신될 수
      # 있다 — SHA256 불일치로 CI가 실패하면 최신 값을 다시 계산해 갱신할 것.
      FFMPEG_URL: "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n7.1-latest-win64-lgpl-shared-7.1.zip"
      FFMPEG_SHA256: 38856fea859c078e2996bb279971ef1f6b4b9a9353701e8e481123762d09592b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: pip install -r requirements.txt pyinstaller
        # python-pptx는 이제 requirements.txt의 실제 런타임 의존성이다
        # (PDF→PPTX, DEC-030) — 별도로 다시 설치할 필요 없음.
      - name: Build HWP engine (hwplib + hwpxlib + sidecar + jlink JRE)
        shell: pwsh
        run: |
          git clone https://github.com/neolord0/hwplib.git hwplib-src
          git -C hwplib-src checkout $env:HWPLIB_REV
          python scripts/patch_hwplib.py hwplib-src
          Get-ChildItem -Recurse hwplib-src/src/main/java -Filter *.java |
            ForEach-Object { $_.FullName } | Set-Content -Encoding utf8 sources.txt
          javac -encoding UTF-8 -nowarn "@sources.txt" -d engine-build/hwp
          # hwpxlib(QA(h) Phase 1, HWPX 읽기) — hwplib과 패키지명이 겹치지
          # 않아(kr.dogfoot.hwplib vs kr.dogfoot.hwpxlib) 같은 engine-build/hwp에
          # 같이 넣는다. 순수 JDK 소스라 hwplib과 달리 패치 불요(spike/hwpxlib/RESULT.md).
          git clone https://github.com/neolord0/hwpxlib.git hwpxlib-src
          git -C hwpxlib-src checkout $env:HWPXLIB_REV
          Get-ChildItem -Recurse hwpxlib-src/src/main/java -Filter *.java |
            ForEach-Object { $_.FullName } | Set-Content -Encoding utf8 sources-hwpx.txt
          javac -encoding UTF-8 -nowarn "@sources-hwpx.txt" -d engine-build/hwp
          javac -encoding UTF-8 -cp engine-build/hwp -d engine-build/hwp `
            sidecar/hwp/HwpToText.java sidecar/hwp/HwpToJson.java sidecar/hwp/JsonToHwp.java `
            sidecar/hwp/HwpxToText.java sidecar/hwp/HwpxToJson.java sidecar/hwp/JsonToHwpx.java
          jlink --add-modules java.base,java.desktop,java.xml,java.logging `
            --strip-debug --no-header-files --no-man-pages --output engine-build/jre
      - name: HWP engine smoke (bundled JRE + 한글 텍스트 샘플)
        shell: pwsh
        run: |
          & engine-build/jre/bin/java.exe -cp engine-build/hwp HwpToText `
            hwplib-src/sample_hwp/big_file.hwp out.txt
          if (-not (Get-Content out.txt -Encoding utf8 | Select-String -Pattern "테스트" -Quiet)) {
            Write-Error "HWP engine smoke failed: 한글 텍스트 추출 불일치"; exit 1
          }
          & engine-build/jre/bin/java.exe -cp engine-build/hwp HwpToText `
            hwplib-src/sample_hwp/merging-cell.hwp out2.txt
          if (-not (Select-String -Path out2.txt -Pattern "0,0" -Quiet)) {
            Write-Error "HWP engine smoke failed: 표 추출 불일치"; exit 1
          }
          & engine-build/jre/bin/java.exe -cp engine-build/hwp HwpToJson `
            hwplib-src/sample_hwp/merging-cell.hwp out.json
          if (-not (Get-Content out.json -Encoding utf8 | Select-String -Pattern '"type":"table"' -Quiet)) {
            Write-Error "HWP engine smoke failed: HwpToJson 표 구조 불일치"; exit 1
          }
          # DEC-017/DEC-028: DOCX→HWP 사이드카(JsonToHwp) — 구조 JSON → HWP 생성 → 재읽기 왕복 검증.
          # DEC-028부터 표는 더 이상 텍스트로 단순화되지 않고 실제 HWP 표
          # 컨트롤로 생성된다(spike/hwplib/SpikeTable.java에서 검증한 패턴).
          Set-Content -Encoding utf8 blocks.json '{"blocks":[{"type":"p","text":"뷁 밟 닳 넋 한글 생성 테스트"},{"type":"table","rows":[[{"text":"이름","colSpan":1,"rowSpan":1},{"text":"부서","colSpan":1,"rowSpan":1}],[{"text":"김철수","colSpan":1,"rowSpan":1},{"text":"영업1팀","colSpan":1,"rowSpan":1}]]}]}'
          & engine-build/jre/bin/java.exe -cp engine-build/hwp JsonToHwp blocks.json created.hwp
          if (-not (Test-Path created.hwp)) {
            Write-Error "HWP engine smoke failed: JsonToHwp가 HWP 파일을 생성하지 못함"; exit 1
          }
          & engine-build/jre/bin/java.exe -cp engine-build/hwp HwpToText created.hwp created.txt
          if (-not (Get-Content created.txt -Encoding utf8 | Select-String -Pattern "뷁 밟 닳 넋 한글 생성 테스트" -Quiet)) {
            Write-Error "HWP engine smoke failed: JsonToHwp 생성 문서 재읽기 텍스트 불일치"; exit 1
          }
          if (-not (Get-Content created.txt -Encoding utf8 | Select-String -Pattern "김철수" -Quiet)) {
            Write-Error "HWP engine smoke failed: JsonToHwp 표 내용 불일치"; exit 1
          }
          # DEC-028: 표가 진짜 표 구조(행/열)로 만들어졌는지 HwpToJson으로
          # 재확인 — 위 HwpToText 체크는 내용만 보고 구조는 못 걸러낸다.
          & engine-build/jre/bin/java.exe -cp engine-build/hwp HwpToJson created.hwp created.json
          $createdJson = Get-Content created.json -Encoding utf8 -Raw
          # DEC-051부터 셀은 항상 {"runs":[...],"colSpan":n,"rowSpan":m} 객체다.
          $dec028Expected = '"type":"table","rows":[[{"runs":[{"text":"이름","bold":false,"italic":false,"underline":false,"size":10.0,"color":"000000"}],"colSpan":1,"rowSpan":1,"align":"justify"},{"runs":[{"text":"부서","bold":false,"italic":false,"underline":false,"size":10.0,"color":"000000"}],"colSpan":1,"rowSpan":1,"align":"justify"}],[{"runs":[{"text":"김철수","bold":false,"italic":false,"underline":false,"size":10.0,"color":"000000"}],"colSpan":1,"rowSpan":1,"align":"justify"},{"runs":[{"text":"영업1팀","bold":false,"italic":false,"underline":false,"size":10.0,"color":"000000"}],"colSpan":1,"rowSpan":1,"align":"justify"}]]'
          if (-not ($createdJson | Select-String -Pattern $dec028Expected -SimpleMatch -Quiet)) {
            Write-Error "HWP engine smoke failed: JsonToHwp가 만든 표가 실제 표 구조(2행×2열)로 재확인되지 않음(DEC-028 회귀)"; exit 1
          }
          # DEC-035: 셀 병합(colSpan/rowSpan) — JsonToHwp가 TableCellMerger로
          # 실제 병합을 적용하고, HwpToJson이 그 구조(병합 안 된 셀은 평문,
          # 병합된 셀은 colSpan/rowSpan 객체)를 그대로 재확인해야 한다.
          Set-Content -Encoding utf8 merge-blocks.json '{"blocks":[{"type":"table","rows":[[{"text":"병합","colSpan":2,"rowSpan":1}],[{"text":"10","colSpan":1,"rowSpan":1},{"text":"11","colSpan":1,"rowSpan":1}]],"colWidthsMm":[30.0,30.0]}]}'
          & engine-build/jre/bin/java.exe -cp engine-build/hwp JsonToHwp merge-blocks.json merged.hwp
          if (-not (Test-Path merged.hwp)) {
            Write-Error "HWP engine smoke failed: JsonToHwp가 병합 표를 생성하지 못함(DEC-035)"; exit 1
          }
          & engine-build/jre/bin/java.exe -cp engine-build/hwp HwpToJson merged.hwp merged.json
          $mergedJson = Get-Content merged.json -Encoding utf8 -Raw
          # DEC-051부터 셀은 항상 {"runs":[...],"colSpan":n,"rowSpan":m} 객체다
          # (문단 블록과 같은 표현, 표 셀 안 서식 보존).
          if (-not ($mergedJson | Select-String -Pattern '"type":"table","rows":\[\[\{"runs":\[\{"text":"병합","bold":false,"italic":false,"underline":false,"size":10\.0,"color":"000000"\}\],"colSpan":2,"rowSpan":1,"align":"justify"\}\],\[\{"runs":\[\{"text":"10","bold":false,"italic":false,"underline":false,"size":10\.0,"color":"000000"\}\],"colSpan":1,"rowSpan":1,"align":"justify"\},\{"runs":\[\{"text":"11","bold":false,"italic":false,"underline":false,"size":10\.0,"color":"000000"\}\],"colSpan":1,"rowSpan":1,"align":"justify"\}\]\]' -Quiet)) {
            Write-Error "HWP engine smoke failed: 셀 병합이 왕복 후 유지되지 않음(DEC-035 회귀)"; exit 1
          }
          # DEC-051: 표 셀 안 문자 서식(굵게/기울임/밑줄/크기/색상) — DEC-038이
          # 문단에 반영한 것과 대칭으로 표 셀 run에도 반영되는지.
          Set-Content -Encoding utf8 cell-formatted-blocks.json '{"blocks":[{"type":"table","rows":[[{"runs":[{"text":"일반 "},{"text":"굵고빨강","bold":true,"color":"FF0000"}],"colSpan":1,"rowSpan":1},{"runs":[{"text":"plain"}],"colSpan":1,"rowSpan":1}]]}]}'
          & engine-build/jre/bin/java.exe -cp engine-build/hwp JsonToHwp cell-formatted-blocks.json cell-formatted.hwp
          if (-not (Test-Path cell-formatted.hwp)) {
            Write-Error "HWP engine smoke failed: JsonToHwp가 셀 서식 있는 표를 생성하지 못함(DEC-051)"; exit 1
          }
          & engine-build/jre/bin/java.exe -cp engine-build/hwp HwpToJson cell-formatted.hwp cell-formatted.json
          $cellFormattedJson = Get-Content cell-formatted.json -Encoding utf8 -Raw
          if (-not ($cellFormattedJson | Select-String -Pattern '"text":"굵고빨강","bold":true,"italic":false,"underline":false,"size":10\.0,"color":"FF0000"' -Quiet)) {
            Write-Error "HWP engine smoke failed: 표 셀 안 굵게·색상 서식이 왕복 후 재확인되지 않음(DEC-051 회귀)"; exit 1
          }
          if (-not ($cellFormattedJson | Select-String -Pattern '"text":"일반 ","bold":false,"italic":false,"underline":false' -Quiet)) {
            Write-Error "HWP engine smoke failed: 표 셀 안 서식 없는 run이 잘못된 서식으로 나옴(DEC-051 회귀)"; exit 1
          }
          # DEC-053: 표 셀 안 문단 정렬(가운데/오른쪽) — DEC-040이 문단에
          # 반영한 것과 대칭으로 표 셀에도 반영되는지.
          Set-Content -Encoding utf8 cell-aligned-blocks.json '{"blocks":[{"type":"table","rows":[[{"runs":[{"text":"가운데"}],"colSpan":1,"rowSpan":1,"align":"center"},{"runs":[{"text":"오른쪽"}],"colSpan":1,"rowSpan":1,"align":"right"}]]}]}'
          & engine-build/jre/bin/java.exe -cp engine-build/hwp JsonToHwp cell-aligned-blocks.json cell-aligned.hwp
          if (-not (Test-Path cell-aligned.hwp)) {
            Write-Error "HWP engine smoke failed: JsonToHwp가 셀 정렬 있는 표를 생성하지 못함(DEC-053)"; exit 1
          }
          & engine-build/jre/bin/java.exe -cp engine-build/hwp HwpToJson cell-aligned.hwp cell-aligned.json
          $cellAlignedJson = Get-Content cell-aligned.json -Encoding utf8 -Raw
          if (-not ($cellAlignedJson | Select-String -Pattern '"text":"가운데".*?"align":"center"' -Quiet)) {
            Write-Error "HWP engine smoke failed: 표 셀 가운데 정렬이 왕복 후 재확인되지 않음(DEC-053 회귀)"; exit 1
          }
          if (-not ($cellAlignedJson | Select-String -Pattern '"text":"오른쪽".*?"align":"right"' -Quiet)) {
            Write-Error "HWP engine smoke failed: 표 셀 오른쪽 정렬이 왕복 후 재확인되지 않음(DEC-053 회귀)"; exit 1
          }
          # DEC-038: DOCX→HWP 문자 서식(굵게/기울임/밑줄/크기/색상) 반영 —
          # JsonToHwp가 run별 서식을 CharShape으로 만들어 ParaCharShape에
          # 위치별로 연결하고, HwpToJson으로 재읽었을 때 run 경계·서식이
          # 그대로 재확인되어야 한다(DEC-027은 읽기 방향만 검증했다 — 이건
          # 쓰기 방향 왕복).
          Set-Content -Encoding utf8 formatted-blocks.json '{"blocks":[{"type":"p","runs":[{"text":"굵은텍스트","bold":true},{"text":"일반텍스트"},{"text":"기울임텍스트","italic":true,"size":18,"color":"FF0000"}]}]}'
          & engine-build/jre/bin/java.exe -cp engine-build/hwp JsonToHwp formatted-blocks.json formatted-created.hwp
          if (-not (Test-Path formatted-created.hwp)) {
            Write-Error "HWP engine smoke failed: JsonToHwp가 서식 있는 문서를 생성하지 못함(DEC-038)"; exit 1
          }
          & engine-build/jre/bin/java.exe -cp engine-build/hwp HwpToJson formatted-created.hwp formatted-created.json
          $formattedCreatedJson = Get-Content formatted-created.json -Encoding utf8 -Raw
          if (-not ($formattedCreatedJson | Select-String -Pattern '"text":"굵은텍스트","bold":true,"italic":false,"underline":false' -Quiet)) {
            Write-Error "HWP engine smoke failed: JsonToHwp가 쓴 굵게 서식이 왕복 후 재확인되지 않음(DEC-038 회귀)"; exit 1
          }
          if (-not ($formattedCreatedJson | Select-String -Pattern '"text":"일반텍스트","bold":false,"italic":false,"underline":false' -Quiet)) {
            Write-Error "HWP engine smoke failed: JsonToHwp가 서식 없는 run을 잘못된 서식으로 씀(DEC-038 회귀)"; exit 1
          }
          if (-not ($formattedCreatedJson | Select-String -Pattern '"text":"기울임텍스트","bold":false,"italic":true,"underline":false,"size":18(\.0)?,"color":"FF0000"' -Quiet)) {
            Write-Error "HWP engine smoke failed: JsonToHwp가 쓴 기울임·크기·색상 서식이 같은 run 안에서 왕복 후 재확인되지 않음(DEC-038 회귀)"; exit 1
          }
          # DEC-039: PDF→HWP 페이지 구분(pageBreakBefore) — JsonToHwp가 이
          # 표시가 있는 문단에만 "문단 앞에서 항상 쪽 나눔" ParaShape을
          # 걸어야 한다. HwpToText/HwpToJson 둘 다 이 속성을 안 보므로
          # PageBreakDebug(테스트 전용, 배포용 engine-build/hwp가 아닌
          # debug-tools에 컴파일)로 직접 확인한다.
          New-Item -ItemType Directory -Force debug-tools | Out-Null
          javac -encoding UTF-8 -cp engine-build/hwp -d debug-tools sidecar/hwp/PageBreakDebug.java
          Set-Content -Encoding utf8 pagebreak-blocks.json '{"blocks":[{"type":"p","text":"1페이지 문단"},{"type":"p","text":"2페이지 문단","pageBreakBefore":true}]}'
          & engine-build/jre/bin/java.exe -cp engine-build/hwp JsonToHwp pagebreak-blocks.json pagebreak.hwp
          if (-not (Test-Path pagebreak.hwp)) {
            Write-Error "HWP engine smoke failed: JsonToHwp가 페이지 구분 있는 문서를 생성하지 못함(DEC-039)"; exit 1
          }
          & engine-build/jre/bin/java.exe -cp "debug-tools;engine-build/hwp" PageBreakDebug pagebreak.hwp pagebreak-out.txt
          $pageBreakOut = Get-Content -Encoding utf8 pagebreak-out.txt
          if (-not ($pageBreakOut | Select-String -Pattern "0`tfalse`t1페이지 문단" -SimpleMatch -Quiet)) {
            Write-Error "HWP engine smoke failed: 1페이지 문단에 쪽 나눔이 잘못 붙음(DEC-039 회귀)"; exit 1
          }
          if (-not ($pageBreakOut | Select-String -Pattern "1`ttrue`t2페이지 문단" -SimpleMatch -Quiet)) {
            Write-Error "HWP engine smoke failed: 2페이지 문단에 쪽 나눔이 반영되지 않음(DEC-039 회귀)"; exit 1
          }
          # DEC-040: 문단 정렬(align) — "align"이 있는 블록은 JsonToHwp가
          # 실제 ParaShape 정렬로 반영하고, "align"이 없는 블록은 HWP 문서
          # 기본 정렬(양쪽 정렬)로 나와야 한다. HwpToJson으로 왕복 재확인.
          Set-Content -Encoding utf8 align-blocks.json '{"blocks":[{"type":"p","text":"기본 정렬"},{"type":"p","text":"가운데 정렬","align":"center"},{"type":"p","text":"오른쪽 정렬","align":"right"}]}'
          & engine-build/jre/bin/java.exe -cp engine-build/hwp JsonToHwp align-blocks.json align.hwp
          if (-not (Test-Path align.hwp)) {
            Write-Error "HWP engine smoke failed: JsonToHwp가 정렬 있는 문서를 생성하지 못함(DEC-040)"; exit 1
          }
          & engine-build/jre/bin/java.exe -cp engine-build/hwp HwpToJson align.hwp align.json
          $alignJson = Get-Content align.json -Encoding utf8 -Raw
          if (-not ($alignJson | Select-String -Pattern '"text":"기본 정렬".*?"align":"justify"' -Quiet)) {
            Write-Error "HWP engine smoke failed: 정렬 미지정 문단이 HWP 기본 정렬(양쪽)로 나오지 않음(DEC-040 회귀)"; exit 1
          }
          if (-not ($alignJson | Select-String -Pattern '"text":"가운데 정렬".*?"align":"center"' -Quiet)) {
            Write-Error "HWP engine smoke failed: 가운데 정렬이 왕복 후 재확인되지 않음(DEC-040 회귀)"; exit 1
          }
          if (-not ($alignJson | Select-String -Pattern '"text":"오른쪽 정렬".*?"align":"right"' -Quiet)) {
            Write-Error "HWP engine smoke failed: 오른쪽 정렬이 왕복 후 재확인되지 않음(DEC-040 회귀)"; exit 1
          }
          # DEC-018: 긴 문단(여러 줄로 감싸질 정도)도 텍스트가 그대로 보존되는지 —
          # LineSeg 줄바꿈 재계산이 텍스트 자체를 깨뜨리지 않는지 확인.
          # ConvertTo-Json 기본 -Depth(2)로는 이 중첩 구조를 다 못 펴서 값이
          # 깨질 수 있어(재현: 문자열이 아닌 System.Collections.Hashtable로
          # 직렬화됨), 이미 검증된 문자열 리터럴 방식을 그대로 쓴다.
          # JsonToHwp는 각 문단 텍스트를 .trim()해서 저장한다(문자열 반복이
          # 남기는 끝 공백을 여기서 미리 없애 기대값과 어긋나지 않게 한다).
          $longText = ("긴 문단 테스트 " * 15).Trim()
          $longBlocksJson = '{"blocks":[{"type":"p","text":"' + $longText + '"},{"type":"p","text":"짧은 다음 문단"}]}'
          Set-Content -Encoding utf8 blocks-long.json $longBlocksJson
          & engine-build/jre/bin/java.exe -cp engine-build/hwp JsonToHwp blocks-long.json created-long.hwp
          & engine-build/jre/bin/java.exe -cp engine-build/hwp HwpToText created-long.hwp created-long.txt
          if (-not (Get-Content created-long.txt -Encoding utf8 -Raw).Trim().Equals("$longText`n짧은 다음 문단".Trim())) {
            Write-Error "HWP engine smoke failed: 긴 문단(줄바꿈 재계산) 재읽기 텍스트 불일치"; exit 1
          }
          # DEC-018 구조 검증(코드 리뷰 지적): 텍스트 왕복만으로는 LineSeg가
          # 문단 길이와 무관하게 항상 1개·세로 위치가 모든 문단에서 0으로
          # 고정되는 회귀를 못 잡는다 — hwplib로 직접 열어 레이아웃 캐시
          # 구조까지 확인한다. LineSegDebug는 테스트 전용 도구라 배포용
          # engine-build/hwp가 아닌 별도 디렉터리에 컴파일한다.
          New-Item -ItemType Directory -Force debug-tools | Out-Null
          javac -encoding UTF-8 -cp engine-build/hwp -d debug-tools sidecar/hwp/LineSegDebug.java
          & engine-build/jre/bin/java.exe -cp "debug-tools;engine-build/hwp" LineSegDebug created-long.hwp `
            | Set-Content -Encoding utf8 lineseg-debug.txt
          $paraLines = Get-Content lineseg-debug.txt
          $p0 = $paraLines[0] -split "`t"
          $lineAlignCount0 = [int]$p0[1]
          if ($lineAlignCount0 -le 1) {
            Write-Error "HWP engine smoke failed: 긴 문단의 lineAlignCount=$lineAlignCount0 — 줄바꿈 재계산이 안 됨(DEC-018 회귀)"; exit 1
          }
          $vpos0 = ($p0[3] -split ",") | ForEach-Object { [int](($_ -split ":")[1]) }
          if (($vpos0 | Select-Object -Unique).Count -ne $lineAlignCount0) {
            Write-Error "HWP engine smoke failed: 줄마다 세로 위치가 달라야 하는데 일부가 겹침(DEC-018 회귀)"; exit 1
          }
          $p1 = $paraLines[1] -split "`t"
          $p1FirstItemParts = ($p1[3] -split ",")[0] -split ":"
          $vpos1First = [int]$p1FirstItemParts[1]
          if ($vpos1First -le ($vpos0 | Select-Object -Last 1)) {
            Write-Error "HWP engine smoke failed: 다음 문단이 이전 문단 아래에서 이어지지 않음(모두 0으로 겹치는 DEC-018 회귀)"; exit 1
          }
          # DEC-027: HwpToJson의 문자 서식(굵게/기울임/크기/색상) 추출 검증.
          # MakeFormattedHwp도 LineSegDebug와 같은 테스트 전용 도구 —
          # 배포용 engine-build/hwp가 아닌 debug-tools에 컴파일한다.
          javac -encoding UTF-8 -cp engine-build/hwp -d debug-tools sidecar/hwp/MakeFormattedHwp.java
          & engine-build/jre/bin/java.exe -cp "debug-tools;engine-build/hwp" MakeFormattedHwp formatted.hwp
          & engine-build/jre/bin/java.exe -cp engine-build/hwp HwpToJson formatted.hwp formatted.json
          $formattedJson = Get-Content formatted.json -Encoding utf8 -Raw
          if (-not ($formattedJson | Select-String -Pattern '"text":"굵은텍스트","bold":true' -Quiet)) {
            Write-Error "HWP engine smoke failed: 굵게 서식이 추출되지 않음(DEC-027 회귀)"; exit 1
          }
          if (-not ($formattedJson | Select-String -Pattern '"text":"일반텍스트","bold":false' -Quiet)) {
            Write-Error "HWP engine smoke failed: 같은 문단 안 일반 run이 굵게로 잘못 표시됨(DEC-027 회귀)"; exit 1
          }
          # [^}]*로 같은 run 객체({...} 하나) 안에서만 매치되도록 제한 —
          # .*는 run 경계를 넘어 서로 다른 run의 속성을 잘못 엮어 맞출 수
          # 있어(코드 리뷰 지적) run 객체 경계를 넘지 않게 좁힘.
          if (-not ($formattedJson | Select-String -Pattern '"italic":true[^}]*"size":18(\.0)?[^}]*"color":"FF0000"' -Quiet)) {
            Write-Error "HWP engine smoke failed: 기울임·크기·색상 서식이 같은 run 안에서 함께 추출되지 않음(DEC-027 회귀)"; exit 1
          }
          # 외부 QA 이슈 #43: 표가 아닌 컨트롤(머리말·글상자) 안의 텍스트가
          # 조용히 사라지던 회귀 — 실사용 공공기관 문서(mois-hwpplan.hwp·
          # unikorea-contract.hwp)에서 실제로 확인된 두 중첩 패턴(머리말
          # 안의 표, 묶음 개체 안의 글상자 2개)을 합성 픽스처로 재현한다.
          javac -encoding UTF-8 -cp engine-build/hwp -d debug-tools sidecar/hwp/MakeNestedControlHwp.java
          & engine-build/jre/bin/java.exe -cp "debug-tools;engine-build/hwp" MakeNestedControlHwp nested.hwp
          & engine-build/jre/bin/java.exe -cp engine-build/hwp HwpToJson nested.hwp nested.json
          $nestedJson = Get-Content nested.json -Encoding utf8 -Raw
          foreach ($expected in @('"text":"머리말텍스트"', '"셀A"', '"셀B"', '"text":"그룹A"', '"text":"그룹B"')) {
            if (-not ($nestedJson | Select-String -Pattern ([regex]::Escape($expected)) -Quiet)) {
              Write-Error "HWP engine smoke failed: 표가 아닌 컨트롤(머리말·글상자) 텍스트 유실(#43 회귀) — $expected 없음"; exit 1
            }
          }
      - name: HWPX engine smoke (QA(h) Phase 1 — hwpxlib 실제 샘플)
        shell: pwsh
        run: |
          & engine-build/jre/bin/java.exe -cp engine-build/hwp HwpxToText `
            hwpxlib-src/testFile/tool/textextractor/multipara.hwpx hwpx_out.txt
          if (-not (Get-Content hwpx_out.txt -Encoding utf8 | Select-String -Pattern "김하성" -Quiet)) {
            Write-Error "HWPX engine smoke failed: 한글 텍스트 추출 불일치"; exit 1
          }
          & engine-build/jre/bin/java.exe -cp engine-build/hwp HwpxToJson `
            hwpxlib-src/testFile/tool/textextractor/multipara.hwpx hwpx_out.json
          $hwpxJson = Get-Content hwpx_out.json -Encoding utf8 -Raw
          if (-not ($hwpxJson | Select-String -Pattern '"bold":false' -Quiet)) {
            Write-Error "HWPX engine smoke failed: HwpxToJson 문단 서식 필드 누락"; exit 1
          }
          & engine-build/jre/bin/java.exe -cp engine-build/hwp HwpxToJson `
            hwpxlib-src/testFile/tool/textextractor/Table.hwpx hwpx_table.json
          $hwpxTableJson = Get-Content hwpx_table.json -Encoding utf8 -Raw
          # DEC-051부터 셀은 항상 {"runs":[...],"colSpan":n,"rowSpan":m} 객체다.
          $tableExpected = '"type":"table","rows":[[{"runs":[{"text":"이름","bold":false,"italic":false,"underline":false,"size":10.0,"color":"000000"}],"colSpan":1,"rowSpan":1,"align":"center"},{"runs":[{"text":"국어","bold":false,"italic":false,"underline":false,"size":10.0,"color":"000000"}],"colSpan":1,"rowSpan":1,"align":"center"},{"runs":[{"text":"영어","bold":false,"italic":false,"underline":false,"size":10.0,"color":"000000"}],"colSpan":1,"rowSpan":1,"align":"center"},{"runs":[{"text":"수학","bold":false,"italic":false,"underline":false,"size":10.0,"color":"000000"}],"colSpan":1,"rowSpan":1,"align":"center"}]'
          if (-not ($hwpxTableJson | Select-String -Pattern $tableExpected -SimpleMatch -Quiet)) {
            Write-Error "HWPX engine smoke failed: 표 구조 불일치"; exit 1
          }
      - name: HWPX header/footer/shape engine smoke (DEC-052)
        shell: pwsh
        run: |
          # DEC-052: 머리말·꼬리말은 Ctrl(HeaderFooterCore) 안, 글상자는
          # 도형 RunItem(DrawingObject/Container) 안에 있어 기존
          # emitParagraph가 순회하지 않고 조용히 건너뛰었다(hwplib 쪽
          # DEC-032와 대칭인 문제) — hwpxlib 자체 테스트 픽스처로 재귀
          # 처리가 실제로 텍스트를 뽑아내는지 확인.
          & engine-build/jre/bin/java.exe -cp engine-build/hwp HwpxToJson `
            hwpxlib-src/testFile/reader_writer/HeaderFooter.hwpx hwpx_headerfooter.json
          $hwpxHeaderFooterJson = Get-Content hwpx_headerfooter.json -Encoding utf8 -Raw
          if (-not ($hwpxHeaderFooterJson | Select-String -Pattern '머리말 테스트' -SimpleMatch -Quiet)) {
            Write-Error "HWPX engine smoke failed: 머리말 텍스트 유실(DEC-052 회귀)"; exit 1
          }
          if (-not ($hwpxHeaderFooterJson | Select-String -Pattern '꼬리말' -SimpleMatch -Quiet)) {
            Write-Error "HWPX engine smoke failed: 꼬리말 텍스트 유실(DEC-052 회귀)"; exit 1
          }
          & engine-build/jre/bin/java.exe -cp engine-build/hwp HwpxToJson `
            hwpxlib-src/testFile/tool/textextractor/RectInRect.hwpx hwpx_nestedshape.json
          $hwpxNestedShapeJson = Get-Content hwpx_nestedshape.json -Encoding utf8 -Raw
          if (-not ($hwpxNestedShapeJson | Select-String -Pattern '사각형' -SimpleMatch -Quiet)) {
            Write-Error "HWPX engine smoke failed: 중첩 글상자 텍스트 유실(DEC-052 회귀)"; exit 1
          }
      - name: HWPX write engine smoke (DOCX/PDF→HWPX 쓰기 — DEC-049)
        shell: pwsh
        run: |
          # DEC-049(DEC-035 대칭): 셀 병합(colSpan/rowSpan) — JsonToHwpx가
          # sparse 표현으로 곧바로 병합된 Tc를 쓰고(TableCellMerger 같은
          # 별도 유틸 없이), HwpxToJson이 그 구조를 그대로 재확인해야 한다.
          Set-Content -Encoding utf8 hwpx-merge-blocks.json '{"blocks":[{"type":"table","rows":[[{"text":"병합","colSpan":2,"rowSpan":1}],[{"text":"10","colSpan":1,"rowSpan":1},{"text":"11","colSpan":1,"rowSpan":1}]],"colWidthsMm":[30.0,30.0]}]}'
          & engine-build/jre/bin/java.exe -cp engine-build/hwp JsonToHwpx hwpx-merge-blocks.json hwpx-merged.hwpx
          if (-not (Test-Path hwpx-merged.hwpx)) {
            Write-Error "HWPX write engine smoke failed: JsonToHwpx가 병합 표를 생성하지 못함(DEC-049)"; exit 1
          }
          & engine-build/jre/bin/java.exe -cp engine-build/hwp HwpxToJson hwpx-merged.hwpx hwpx-merged.json
          $hwpxMergedJson = Get-Content hwpx-merged.json -Encoding utf8 -Raw
          # DEC-051부터 셀은 항상 {"runs":[...],"colSpan":n,"rowSpan":m} 객체다.
          if (-not ($hwpxMergedJson | Select-String -Pattern '"type":"table","rows":\[\[\{"runs":\[\{"text":"병합","bold":false,"italic":false,"underline":false,"size":10\.0,"color":"000000"\}\],"colSpan":2,"rowSpan":1,"align":"justify"\}\],\[\{"runs":\[\{"text":"10","bold":false,"italic":false,"underline":false,"size":10\.0,"color":"000000"\}\],"colSpan":1,"rowSpan":1,"align":"justify"\},\{"runs":\[\{"text":"11","bold":false,"italic":false,"underline":false,"size":10\.0,"color":"000000"\}\],"colSpan":1,"rowSpan":1,"align":"justify"\}\]\]' -Quiet)) {
            Write-Error "HWPX write engine smoke failed: 셀 병합이 왕복 후 유지되지 않음(DEC-049 회귀)"; exit 1
          }
          # DEC-051: 표 셀 안 문자 서식(굵게/기울임/밑줄/크기/색상) — HWP
          # 쪽과 대칭으로 표 셀 run에도 반영되는지.
          Set-Content -Encoding utf8 hwpx-cell-formatted-blocks.json '{"blocks":[{"type":"table","rows":[[{"runs":[{"text":"일반 "},{"text":"굵고빨강","bold":true,"color":"FF0000"}],"colSpan":1,"rowSpan":1},{"runs":[{"text":"plain"}],"colSpan":1,"rowSpan":1}]]}]}'
          & engine-build/jre/bin/java.exe -cp engine-build/hwp JsonToHwpx hwpx-cell-formatted-blocks.json hwpx-cell-formatted.hwpx
          if (-not (Test-Path hwpx-cell-formatted.hwpx)) {
            Write-Error "HWPX write engine smoke failed: JsonToHwpx가 셀 서식 있는 표를 생성하지 못함(DEC-051)"; exit 1
          }
          & engine-build/jre/bin/java.exe -cp engine-build/hwp HwpxToJson hwpx-cell-formatted.hwpx hwpx-cell-formatted.json
          $hwpxCellFormattedJson = Get-Content hwpx-cell-formatted.json -Encoding utf8 -Raw
          if (-not ($hwpxCellFormattedJson | Select-String -Pattern '"text":"굵고빨강","bold":true,"italic":false,"underline":false,"size":10\.0,"color":"FF0000"' -Quiet)) {
            Write-Error "HWPX write engine smoke failed: 표 셀 안 굵게·색상 서식이 왕복 후 재확인되지 않음(DEC-051 회귀)"; exit 1
          }
          if (-not ($hwpxCellFormattedJson | Select-String -Pattern '"text":"일반 ","bold":false,"italic":false,"underline":false' -Quiet)) {
            Write-Error "HWPX write engine smoke failed: 표 셀 안 서식 없는 run이 잘못된 서식으로 나옴(DEC-051 회귀)"; exit 1
          }
          # DEC-053: 표 셀 안 문단 정렬(가운데/오른쪽) — HWP 쪽과 대칭으로
          # 표 셀에도 반영되는지.
          Set-Content -Encoding utf8 hwpx-cell-aligned-blocks.json '{"blocks":[{"type":"table","rows":[[{"runs":[{"text":"가운데"}],"colSpan":1,"rowSpan":1,"align":"center"},{"runs":[{"text":"오른쪽"}],"colSpan":1,"rowSpan":1,"align":"right"}]]}]}'
          & engine-build/jre/bin/java.exe -cp engine-build/hwp JsonToHwpx hwpx-cell-aligned-blocks.json hwpx-cell-aligned.hwpx
          if (-not (Test-Path hwpx-cell-aligned.hwpx)) {
            Write-Error "HWPX write engine smoke failed: JsonToHwpx가 셀 정렬 있는 표를 생성하지 못함(DEC-053)"; exit 1
          }
          & engine-build/jre/bin/java.exe -cp engine-build/hwp HwpxToJson hwpx-cell-aligned.hwpx hwpx-cell-aligned.json
          $hwpxCellAlignedJson = Get-Content hwpx-cell-aligned.json -Encoding utf8 -Raw
          if (-not ($hwpxCellAlignedJson | Select-String -Pattern '"text":"가운데".*?"align":"center"' -Quiet)) {
            Write-Error "HWPX write engine smoke failed: 표 셀 가운데 정렬이 왕복 후 재확인되지 않음(DEC-053 회귀)"; exit 1
          }
          if (-not ($hwpxCellAlignedJson | Select-String -Pattern '"text":"오른쪽".*?"align":"right"' -Quiet)) {
            Write-Error "HWPX write engine smoke failed: 표 셀 오른쪽 정렬이 왕복 후 재확인되지 않음(DEC-053 회귀)"; exit 1
          }
          # DEC-049 머지 전 자동 리뷰 지적(재현 확인 후 수정): parseTableSpec이
          # 셀을 항상 Map으로 캐스팅해, HwpxToJson이 병합 없는 셀을 평문
          # 문자열로 내보내는 것(하위 호환, DEC-035와 동일 원칙)과 왕복이
          # 안 됐다(ClassCastException) — 문자열 셀도 받아들이는지 확인.
          Set-Content -Encoding utf8 hwpx-string-cell-blocks.json '{"blocks":[{"type":"table","rows":[["a","b"],["c","d"]]}]}'
          & engine-build/jre/bin/java.exe -cp engine-build/hwp JsonToHwpx hwpx-string-cell-blocks.json hwpx-string-cell.hwpx
          if (-not (Test-Path hwpx-string-cell.hwpx)) {
            Write-Error "HWPX write engine smoke failed: JsonToHwpx가 평문 문자열 셀 표를 생성하지 못함(DEC-049 회귀)"; exit 1
          }
          & engine-build/jre/bin/java.exe -cp engine-build/hwp HwpxToJson hwpx-string-cell.hwpx hwpx-string-cell.json
          $hwpxStringCellJson = Get-Content hwpx-string-cell.json -Encoding utf8 -Raw
          # DEC-051부터 셀은 항상 {"runs":[...],"colSpan":n,"rowSpan":m} 객체다.
          $stringCellExpected = '"type":"table","rows":[[{"runs":[{"text":"a","bold":false,"italic":false,"underline":false,"size":10.0,"color":"000000"}],"colSpan":1,"rowSpan":1,"align":"justify"},{"runs":[{"text":"b","bold":false,"italic":false,"underline":false,"size":10.0,"color":"000000"}],"colSpan":1,"rowSpan":1,"align":"justify"}],[{"runs":[{"text":"c","bold":false,"italic":false,"underline":false,"size":10.0,"color":"000000"}],"colSpan":1,"rowSpan":1,"align":"justify"},{"runs":[{"text":"d","bold":false,"italic":false,"underline":false,"size":10.0,"color":"000000"}],"colSpan":1,"rowSpan":1,"align":"justify"}]]'
          if (-not ($hwpxStringCellJson | Select-String -Pattern $stringCellExpected -SimpleMatch -Quiet)) {
            Write-Error "HWPX write engine smoke failed: 평문 문자열 셀 표가 왕복 후 유지되지 않음(DEC-049 회귀)"; exit 1
          }
          # DEC-049(DEC-038 대칭): 문자 서식(굵게/기울임/크기/색상).
          Set-Content -Encoding utf8 hwpx-formatted-blocks.json '{"blocks":[{"type":"p","runs":[{"text":"굵은텍스트","bold":true},{"text":"일반텍스트"},{"text":"기울임텍스트","italic":true,"size":18,"color":"FF0000"}]}]}'
          & engine-build/jre/bin/java.exe -cp engine-build/hwp JsonToHwpx hwpx-formatted-blocks.json hwpx-formatted.hwpx
          if (-not (Test-Path hwpx-formatted.hwpx)) {
            Write-Error "HWPX write engine smoke failed: JsonToHwpx가 서식 있는 문서를 생성하지 못함(DEC-049)"; exit 1
          }
          & engine-build/jre/bin/java.exe -cp engine-build/hwp HwpxToJson hwpx-formatted.hwpx hwpx-formatted.json
          $hwpxFormattedJson = Get-Content hwpx-formatted.json -Encoding utf8 -Raw
          if (-not ($hwpxFormattedJson | Select-String -Pattern '"text":"굵은텍스트","bold":true,"italic":false,"underline":false' -Quiet)) {
            Write-Error "HWPX write engine smoke failed: JsonToHwpx가 쓴 굵게 서식이 왕복 후 재확인되지 않음(DEC-049 회귀)"; exit 1
          }
          if (-not ($hwpxFormattedJson | Select-String -Pattern '"text":"일반텍스트","bold":false,"italic":false,"underline":false' -Quiet)) {
            Write-Error "HWPX write engine smoke failed: JsonToHwpx가 서식 없는 run을 잘못된 서식으로 씀(DEC-049 회귀)"; exit 1
          }
          if (-not ($hwpxFormattedJson | Select-String -Pattern '"italic":true[^}]*"size":18(\.0)?[^}]*"color":"FF0000"' -Quiet)) {
            Write-Error "HWPX write engine smoke failed: 기울임·크기·색상 서식이 같은 run 안에서 왕복 후 재확인되지 않음(DEC-049 회귀)"; exit 1
          }
          # DEC-049(DEC-040 대칭): 문단 정렬.
          Set-Content -Encoding utf8 hwpx-align-blocks.json '{"blocks":[{"type":"p","text":"기본 정렬"},{"type":"p","text":"가운데 정렬","align":"center"},{"type":"p","text":"오른쪽 정렬","align":"right"}]}'
          & engine-build/jre/bin/java.exe -cp engine-build/hwp JsonToHwpx hwpx-align-blocks.json hwpx-align.hwpx
          & engine-build/jre/bin/java.exe -cp engine-build/hwp HwpxToJson hwpx-align.hwpx hwpx-align.json
          $hwpxAlignJson = Get-Content hwpx-align.json -Encoding utf8 -Raw
          if (-not ($hwpxAlignJson | Select-String -Pattern '"text":"기본 정렬".*?"align":"justify"' -Quiet)) {
            Write-Error "HWPX write engine smoke failed: 정렬 미지정 문단이 기본 정렬(양쪽)로 나오지 않음(DEC-049 회귀)"; exit 1
          }
          if (-not ($hwpxAlignJson | Select-String -Pattern '"text":"가운데 정렬".*?"align":"center"' -Quiet)) {
            Write-Error "HWPX write engine smoke failed: 가운데 정렬이 왕복 후 재확인되지 않음(DEC-049 회귀)"; exit 1
          }
          if (-not ($hwpxAlignJson | Select-String -Pattern '"text":"오른쪽 정렬".*?"align":"right"' -Quiet)) {
            Write-Error "HWPX write engine smoke failed: 오른쪽 정렬이 왕복 후 재확인되지 않음(DEC-049 회귀)"; exit 1
          }
          # DEC-049(DEC-039 대칭): 쪽 나눔(pageBreakBefore) — HwpxToJson 정식
          # 스키마는 이 값을 안 보므로(HWP와 동일한 이유) PageBreakDebugHwpx
          # (테스트 전용, 배포용 engine-build/hwp가 아닌 debug-tools에 컴파일)로
          # 직접 확인한다.
          New-Item -ItemType Directory -Force debug-tools | Out-Null
          javac -encoding UTF-8 -cp engine-build/hwp -d debug-tools sidecar/hwp/PageBreakDebugHwpx.java
          Set-Content -Encoding utf8 hwpx-pagebreak-blocks.json '{"blocks":[{"type":"p","text":"1페이지 문단"},{"type":"p","text":"2페이지 문단","pageBreakBefore":true}]}'
          & engine-build/jre/bin/java.exe -cp engine-build/hwp JsonToHwpx hwpx-pagebreak-blocks.json hwpx-pagebreak.hwpx
          if (-not (Test-Path hwpx-pagebreak.hwpx)) {
            Write-Error "HWPX write engine smoke failed: JsonToHwpx가 페이지 구분 있는 문서를 생성하지 못함(DEC-049)"; exit 1
          }
          & engine-build/jre/bin/java.exe -cp "debug-tools;engine-build/hwp" PageBreakDebugHwpx hwpx-pagebreak.hwpx hwpx-pagebreak-out.txt
          $hwpxPageBreakOut = Get-Content -Encoding utf8 hwpx-pagebreak-out.txt
          if (-not ($hwpxPageBreakOut | Select-String -Pattern "0`tfalse`t1페이지 문단" -SimpleMatch -Quiet)) {
            Write-Error "HWPX write engine smoke failed: 1페이지 문단에 쪽 나눔이 잘못 붙음(DEC-049 회귀)"; exit 1
          }
          if (-not ($hwpxPageBreakOut | Select-String -Pattern "1`ttrue`t2페이지 문단" -SimpleMatch -Quiet)) {
            Write-Error "HWPX write engine smoke failed: 2페이지 문단에 쪽 나눔이 반영되지 않음(DEC-049 회귀)"; exit 1
          }
      - name: Cache LibreOffice installer
        uses: actions/cache@v4
        with:
          path: lo-installer
          # 체크섬을 키에 포함 — 버전 번호를 안 바꾸고 재서명된 설치파일이
          # 올라오는 등의 경우에도 캐시가 조용히 낡은 채로 재사용되지 않는다.
          key: libreoffice-installer-${{ env.LO_VERSION }}-${{ env.LO_SHA256 }}-win-x86_64
      - name: Download + verify LibreOffice installer (고정 버전·SHA256)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force lo-installer | Out-Null
          $msi = "lo-installer/LibreOffice.msi"
          if (-not (Test-Path $msi)) {
            $url = "https://download.documentfoundation.org/libreoffice/stable/$env:LO_VERSION/win/x86_64/LibreOffice_${env:LO_VERSION}_Win_x86-64.msi"
            curl.exe -fsSL -o $msi $url
          }
          $hash = (Get-FileHash $msi -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:LO_SHA256) {
            Write-Error "LibreOffice 설치파일 체크섬 불일치: $hash (기대값 $env:LO_SHA256)"
            Remove-Item $msi -Force
            exit 1
          }
          Write-Host "체크섬 확인 완료: $hash"
      - name: Extract LibreOffice (administrative install — 시스템 설치 없이 파일만 추출)
        shell: pwsh
        run: |
          $target = "$PWD\lo-extract"
          $p = Start-Process msiexec.exe -ArgumentList @('/a', 'lo-installer\LibreOffice.msi', '/qn', "TARGETDIR=$target") -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            Write-Error "LibreOffice 관리자 설치(추출) 실패 (exit $($p.ExitCode))"; exit 1
          }
          $soffice = Get-ChildItem -Path $target -Recurse -Filter soffice.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $soffice) {
            Write-Error "추출 결과에서 soffice.exe를 찾을 수 없습니다"; exit 1
          }
          $loRoot = Split-Path $soffice.DirectoryName -Parent
          New-Item -ItemType Directory -Force engine-build/libreoffice | Out-Null
          Copy-Item -Recurse "$loRoot\*" engine-build/libreoffice/
          if (-not (Test-Path engine-build/libreoffice/program/soffice.exe)) {
            Write-Error "정규화 경로(engine-build/libreoffice/program/soffice.exe)에 파일이 없습니다"; exit 1
          }
          New-Item -ItemType Directory -Force engine-build/licenses/libreoffice | Out-Null
          Get-ChildItem -Path $loRoot -Filter "LICENSE*" | Copy-Item -Destination engine-build/licenses/libreoffice/
          Get-ChildItem -Path $loRoot -Filter "NOTICE*" -ErrorAction SilentlyContinue | Copy-Item -Destination engine-build/licenses/libreoffice/
      - name: Cache Noto Sans KR font
        uses: actions/cache@v4
        with:
          path: notokr.zip
          key: notosanskr-${{ env.NOTOKR_RELEASE_TAG }}-${{ env.NOTOKR_SHA256 }}
      - name: 한글 글꼴 번들 (Noto Sans KR — DEC-015)
        shell: pwsh
        run: |
          # 배경: 번들 LibreOffice 자체 글꼴엔 한글이 전혀 없어(0/118) 호스트 Windows에
          # 설치된 글꼴에만 의존하면 드문 한글 자모·한자가 누락될 수 있음이 실사용 중
          # 확인됨(DEC-015). LibreOffice는 program 폴더뿐 아니라 share/fonts/truetype도
          # 자체 스캔하므로, 그 안에 넣기만 하면 시스템 글꼴 설치 없이도 항상 사용된다.
          if (-not (Test-Path notokr.zip)) {
            $url = "https://github.com/notofonts/noto-cjk/releases/download/$env:NOTOKR_RELEASE_TAG/17_NotoSansKR.zip"
            curl.exe -fsSL -o notokr.zip $url
          }
          $hash = (Get-FileHash notokr.zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:NOTOKR_SHA256) {
            Write-Error "Noto Sans KR 체크섬 불일치: $hash (기대값 $env:NOTOKR_SHA256)"
            Remove-Item notokr.zip -Force
            exit 1
          }
          $fontDir = "engine-build/libreoffice/share/fonts/truetype"
          New-Item -ItemType Directory -Force $fontDir | Out-Null
          Expand-Archive notokr.zip -DestinationPath notokr-extract -Force
          Copy-Item notokr-extract/NotoSansKR-Regular.otf $fontDir/
          Copy-Item notokr-extract/NotoSansKR-Bold.otf $fontDir/
          New-Item -ItemType Directory -Force engine-build/licenses/notosanskr | Out-Null
          Copy-Item notokr-extract/LICENSE engine-build/licenses/notosanskr/LICENSE.txt
          if (-not (Test-Path "$fontDir/NotoSansKR-Regular.otf")) {
            Write-Error "글꼴 번들 실패: $fontDir/NotoSansKR-Regular.otf 없음"; exit 1
          }
      - name: Cache FFmpeg build
        uses: actions/cache@v4
        with:
          path: ffmpeg.zip
          key: ffmpeg-${{ env.FFMPEG_SHA256 }}-win64-lgpl-shared
      - name: 영상 엔진 번들 (FFmpeg LGPL — DEC-024)
        shell: pwsh
        run: |
          if (-not (Test-Path ffmpeg.zip)) {
            curl.exe -fsSL -o ffmpeg.zip $env:FFMPEG_URL
          }
          $hash = (Get-FileHash ffmpeg.zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:FFMPEG_SHA256) {
            Write-Error "FFmpeg 체크섬 불일치: $hash (기대값 $env:FFMPEG_SHA256)"
            Remove-Item ffmpeg.zip -Force
            exit 1
          }
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-extract -Force
          $binDir = Get-ChildItem -Path ffmpeg-extract -Directory | Select-Object -First 1 | ForEach-Object { Join-Path $_.FullName "bin" }
          New-Item -ItemType Directory -Force engine-build/ffmpeg | Out-Null
          # ffplay.exe(대화형 플레이어, ~15MB)는 앱에서 쓰지 않아 제외 — 나머지
          # bin/ 전체(ffmpeg.exe·ffprobe.exe·필요 DLL)는 그대로 번들한다.
          Get-ChildItem -Path $binDir -Exclude "ffplay.exe" | Copy-Item -Destination engine-build/ffmpeg/ -Recurse
          if (-not (Test-Path engine-build/ffmpeg/ffmpeg.exe)) {
            Write-Error "FFmpeg 번들 실패: engine-build/ffmpeg/ffmpeg.exe 없음"; exit 1
          }
          $licenseSrc = Get-ChildItem -Path ffmpeg-extract -Recurse -Filter "LICENSE.txt" | Select-Object -First 1
          New-Item -ItemType Directory -Force engine-build/licenses/ffmpeg | Out-Null
          Copy-Item $licenseSrc.FullName engine-build/licenses/ffmpeg/LICENSE.txt
      - name: "[SPIKE 임시 진단] 인코더 목록 확인 — 병합하지 않음"
        shell: pwsh
        run: |
          & engine-build/ffmpeg/ffmpeg.exe -hide_banner -encoders 2>&1 | Select-String -Pattern "264|265|hevc|mf|nvenc|amf|qsv"
      - name: 영상 엔진 스모크 (번들된 실제 경로에서 실행 검증)
        shell: pwsh
        run: |
          # 이 LGPL 빌드는 GPL 인코더(libx264 등)가 없어 자체적으로 H.264 영상을
          # 만들 수 없다 — 저장소에 미리 넣어 둔 실제 H.264+AAC 샘플로 "스트림
          # 카피"(재인코딩 없음) 경로만 검증한다(DEC-024 범위와 정확히 일치).
          & engine-build/ffmpeg/ffmpeg.exe -y -i sidecar/ffmpeg/sample_h264_aac.mov `
            -map 0:v:0 -map "0:a:0?" -c:v copy -c:a copy -sn ffmpeg-smoke-out.mp4
          if (-not (Test-Path ffmpeg-smoke-out.mp4)) {
            Write-Error "FFmpeg 엔진 스모크 실패: 출력 파일 없음"; exit 1
          }
          $srcMd5 = & engine-build/ffmpeg/ffmpeg.exe -y -i sidecar/ffmpeg/sample_h264_aac.mov -f md5 -c:v copy -an - 2>$null
          $outMd5 = & engine-build/ffmpeg/ffmpeg.exe -y -i ffmpeg-smoke-out.mp4 -f md5 -c:v copy -an - 2>$null
          if ($srcMd5 -ne $outMd5) {
            Write-Error "FFmpeg 엔진 스모크 실패: 스트림 카피가 무손실이 아님(재인코딩된 것으로 보임)"; exit 1
          }
      - name: LibreOffice + HWP→PDF 파이프라인 스모크 (사전 빌드 경로)
        shell: pwsh
        env:
          FILECONV_SOFFICE: engine-build\libreoffice\program\soffice.exe
          FILECONV_JAVA: engine-build\jre\bin\java.exe
          FILECONV_HWP_CLASSPATH: engine-build\hwp
          FILECONV_FFMPEG: engine-build\ffmpeg\ffmpeg.exe
          FILECONV_FFPROBE: engine-build\ffmpeg\ffprobe.exe
          PYTHONIOENCODING: utf-8
        run: |
          python scripts/smoke_pdf_pipeline.py hwplib-src/sample_hwp/basic/표.hwp
          if ($LASTEXITCODE -ne 0) { Write-Error "PDF 파이프라인 스모크 실패"; exit 1 }
      - name: Build exe
        run: >
          pyinstaller --noconfirm --clean --windowed --name FileConverter
          --icon packaging/icon.ico --collect-submodules app run.py
      - name: Bundle engine into dist (+ 제3자 라이선스 고지)
        shell: pwsh
        run: |
          Copy-Item -Recurse engine-build dist/FileConverter/engine
          New-Item -ItemType Directory -Force dist/FileConverter/engine/licenses | Out-Null
          Copy-Item hwplib-src/license.txt dist/FileConverter/engine/licenses/hwplib-LICENSE.txt
          Copy-Item hwpxlib-src/license.txt dist/FileConverter/engine/licenses/hwpxlib-LICENSE.txt
          Copy-Item packaging/THIRD_PARTY_NOTICES.txt dist/FileConverter/THIRD_PARTY_NOTICES.txt
          # app/version.py가 배포판(frozen)에서 exe 옆의 이 파일로 현재 버전을
          # 읽는다(OQ-002 업데이트 확인 기능 — DEC-022). packaging/VERSION이
          # 유일한 정본이라 값을 복제하지 않고 그대로 복사만 한다.
          Copy-Item packaging/VERSION dist/FileConverter/VERSION
      - name: Verify bundled artifact (엔진 실행·라이선스·JRE legal)
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          if (-not (Test-Path dist/FileConverter/engine/jre/legal)) {
            Write-Error "jlink JRE legal 디렉터리가 아티팩트에 없습니다"; exit 1
          }
          if (-not (Test-Path dist/FileConverter/THIRD_PARTY_NOTICES.txt)) {
            Write-Error "THIRD_PARTY_NOTICES.txt 누락"; exit 1
          }
          if (-not (Test-Path dist/FileConverter/engine/licenses/hwpxlib-LICENSE.txt)) {
            Write-Error "hwpxlib 라이선스 파일이 아티팩트에 없습니다 (QA(h) Phase 1)"; exit 1
          }
          if (-not (Get-ChildItem dist/FileConverter/engine/licenses/libreoffice -Filter "LICENSE*" -ErrorAction SilentlyContinue)) {
            Write-Error "LibreOffice 라이선스 파일이 아티팩트에 없습니다"; exit 1
          }
          if (-not (Test-Path dist/FileConverter/engine/libreoffice/share/fonts/truetype/NotoSansKR-Regular.otf)) {
            Write-Error "Noto Sans KR 글꼴이 아티팩트에 없습니다 (DEC-015)"; exit 1
          }
          if (-not (Test-Path dist/FileConverter/engine/licenses/notosanskr/LICENSE.txt)) {
            Write-Error "Noto Sans KR 라이선스 파일이 아티팩트에 없습니다"; exit 1
          }
          if (-not (Test-Path dist/FileConverter/engine/licenses/ffmpeg/LICENSE.txt)) {
            Write-Error "FFmpeg 라이선스 파일이 아티팩트에 없습니다 (DEC-024)"; exit 1
          }
          if (-not (Test-Path dist/FileConverter/engine/ffmpeg/ffmpeg.exe)) {
            Write-Error "FFmpeg 엔진이 아티팩트에 없습니다 (DEC-024)"; exit 1
          }
          if (-not (Get-ChildItem -Recurse -Path dist/FileConverter -Filter "PIL" -Directory -ErrorAction SilentlyContinue)) {
            Write-Error "Pillow(PIL) 패키지가 패키징된 아티팩트에 없습니다 (DEC-025) — PyInstaller가 lazy import를 놓쳤을 수 있음"; exit 1
          }
          if (-not (Get-ChildItem -Recurse -Path dist/FileConverter -Filter "pypdfium2*" -ErrorAction SilentlyContinue)) {
            Write-Error "pypdfium2 패키지가 패키징된 아티팩트에 없습니다 (DEC-025) — PyInstaller가 lazy import를 놓쳤을 수 있음"; exit 1
          }
          if (-not (Get-ChildItem -Recurse -Path dist/FileConverter -Filter "pptx" -Directory -ErrorAction SilentlyContinue)) {
            Write-Error "python-pptx 패키지가 패키징된 아티팩트에 없습니다 (DEC-030) — PyInstaller가 lazy import를 놓쳤을 수 있음"; exit 1
          }
          $bundledVersion = (Get-Content dist/FileConverter/VERSION -Raw -ErrorAction SilentlyContinue)
          if ($bundledVersion -ne (Get-Content packaging/VERSION -Raw)) {
            Write-Error "번들된 VERSION이 packaging/VERSION과 다릅니다(업데이트 확인 기능 오탐 위험) — 번들: '$bundledVersion'"; exit 1
          }
          # 패키징 후 실제 배포 경로에서 사이드카 실행 검증
          & dist/FileConverter/engine/jre/bin/java.exe -cp dist/FileConverter/engine/hwp `
            HwpToText hwplib-src/sample_hwp/merging-cell.hwp out3.txt
          if (-not (Select-String -Path out3.txt -Pattern "0,0" -Quiet)) {
            Write-Error "패키징 경로 사이드카 스모크 실패"; exit 1
          }
          & dist/FileConverter/engine/ffmpeg/ffmpeg.exe -y -i sidecar/ffmpeg/sample_h264_aac.mov `
            -map 0:v:0 -map "0:a:0?" -c:v copy -c:a copy -sn packaged-ffmpeg-out.mp4
          if (-not (Test-Path packaged-ffmpeg-out.mp4)) {
            Write-Error "패키징 경로 FFmpeg 스모크 실패"; exit 1
          }
          # 환경변수 없이 --frozen-exe로 실제 FileConverter.exe 실행 시나리오를 흉내내
          # engine_dir() 자동 탐색(app/bundle.py)이 진짜로 엔진을 찾는지 검증한다.
          # (FILECONV_* 오버라이드는 여기서 절대 쓰지 않는다 — 그러면 자동 탐색 자체가
          # 검증되지 않고 "경로를 알려주면 실행된다"만 확인하게 된다.)
          python scripts/smoke_pdf_pipeline.py hwplib-src/sample_hwp/basic/표.hwp `
            --frozen-exe dist/FileConverter/FileConverter.exe
          if ($LASTEXITCODE -ne 0) { Write-Error "패키징 경로(자동 탐색) PDF 파이프라인 스모크 실패"; exit 1 }
      - name: Smoke run (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist/FileConverter/FileConverter.exe -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { Write-Error "app exited early (code $($p.ExitCode))"; exit 1 }
          Stop-Process -Id $p.Id -Force
      - name: Install Inno Setup (인스톨러 빌드 도구 — v0.3c·DEC-013)
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: |
          $version = (Get-Content packaging/VERSION -Raw).Trim()
          $distAbs = (Resolve-Path dist/FileConverter).Path
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\installer.iss `
            "/DMyAppVersion=$version" "/DDistDir=$distAbs"
          if ($LASTEXITCODE -ne 0) { Write-Error "인스톨러 컴파일 실패"; exit 1 }
          $exe = Get-ChildItem packaging/installer-out -Filter *.exe | Select-Object -First 1
          if (-not $exe) { Write-Error "인스톨러 산출물을 찾을 수 없습니다"; exit 1 }
          Write-Host "빌드됨: $($exe.FullName) ($([math]::Round($exe.Length/1MB)) MB)"
          # 번들이 전량 64비트인데 이 지시자가 없으면 "모든 사용자용으로 설치" 선택 시
          # {autopf}가 32비트 전용 Program Files (x86)로 잘못 풀린다(실사용 QA #48).
          # UAC 승격이 필요해 무인 CI로 실제 설치 경로까지 매번 검증하기는 어려워(승격
          # 대화상자가 무인 환경에서 멈출 위험), 최소한 지시자가 소스에서 사라지지
          # 않았는지는 매번 확인한다 — 실제 "모든 사용자용" 설치 경로 확인은 수동 검증
          # 잔여 리스크로 남긴다(docs/06_open_questions.md 참고).
          $issContent = Get-Content packaging/installer.iss -Raw
          if ($issContent -notmatch 'ArchitecturesInstallIn64BitMode=x64compatible') {
            Write-Error "installer.iss에 ArchitecturesInstallIn64BitMode 지시자가 없습니다(#48 회귀)"; exit 1
          }
          if ($issContent -notmatch 'ArchitecturesAllowed=x64compatible') {
            Write-Error "installer.iss에 ArchitecturesAllowed 지시자가 없습니다(#48 회귀)"; exit 1
          }
      - name: Installer smoke (무설치 폴더에 실치→실행→제거 전 과정 검증)
        shell: pwsh
        run: |
          $exe = Get-ChildItem packaging/installer-out -Filter *.exe | Select-Object -First 1
          $installDir = "$PWD\installer-smoke-target"

          # 무인 설치 — PrivilegesRequired=lowest가 기본이라 사용자 폴더 설치에
          # 별도 권한 override 플래그가 필요 없다(installer.iss 참고)
          Start-Process -FilePath $exe.FullName -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART',
            "/DIR=$installDir"
          ) -Wait
          $installedExe = "$installDir\FileConverter.exe"
          if (-not (Test-Path $installedExe)) {
            Write-Error "설치 후 FileConverter.exe가 없습니다: $installedExe"; exit 1
          }
          if (-not (Test-Path "$installDir\engine\libreoffice\program\soffice.exe")) {
            Write-Error "설치된 위치에 번들 엔진이 없습니다"; exit 1
          }
          Write-Host "설치 확인 완료: $installedExe"

          # 설치된 실제 위치에서 실행까지 확인 (아이콘·바로가기가 아닌 exe 자체)
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process -FilePath $installedExe -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { Write-Error "설치된 exe 실행 실패 (code $($p.ExitCode))"; exit 1 }
          Stop-Process -Id $p.Id -Force

          # 무인 제거 — 언인스톨러가 깨끗하게 지우는지 확인 (REQ-NF-003 정신: 흔적 안 남기기)
          $uninstaller = Get-ChildItem $installDir -Filter "unins*.exe" | Select-Object -First 1
          if (-not $uninstaller) { Write-Error "언인스톨러를 찾을 수 없습니다"; exit 1 }
          Start-Process -FilePath $uninstaller.FullName -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          ) -Wait
          Start-Sleep -Seconds 2
          if (Test-Path $installedExe) {
            Write-Error "제거 후에도 FileConverter.exe가 남아 있습니다"; exit 1
          }
          Write-Host "제거 확인 완료"
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: FileConverter-windows-portable
          path: dist/FileConverter/
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: FileConverter-windows-installer
          path: packaging/installer-out/*.exe

  build-macos:
    # macOS 배포 (Apple Silicon/arm64 전용, 미서명 — 서명 없이 배포하기로 결정,
    # docs/06_open_questions.md 참고). 영상→MP4는 v1에서 미지원(DEC-029 —
    # 검증된 사전 빌드 LGPL macOS FFmpeg 바이너리가 없어 FFmpeg 단계 자체를
    # 생략함). 나머지 파이프라인(HWP·LibreOffice)은 Windows 잡과 동일 리비전·
    # 버전을 재사용해 산출물 간 동작 차이가 없도록 한다.
    needs: test
    runs-on: macos-latest
    env:
      HWPLIB_REV: d9e073d6899d947f8f583492e00a5e1062381d7e
      HWPXLIB_REV: 473d9d6aa82d8896f4f464b52d801e5691dc7cf3
      LO_VERSION: "26.2.5"
      # 공식 배포 서버에서 curl로 직접 확인한 SHA256 (mac/aarch64).
      LO_MAC_SHA256: c99fb4fe574437fc4cb820a4ca15271bca325920861f7139858b36d7f9df78ad
      NOTOKR_RELEASE_TAG: "Sans2.004"
      NOTOKR_SHA256: ac7eeb4e2b0d41de8ff31b2d6e1e2a41caf253fd5cefb380bfa1f40f1747b612
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: pip install -r requirements.txt pyinstaller
      - name: Build HWP engine (hwplib + hwpxlib + sidecar + jlink JRE)
        run: |
          git clone https://github.com/neolord0/hwplib.git hwplib-src
          git -C hwplib-src checkout "$HWPLIB_REV"
          python3 scripts/patch_hwplib.py hwplib-src
          find hwplib-src/src/main/java -name '*.java' > sources.txt
          javac -encoding UTF-8 -nowarn @sources.txt -d engine-build/hwp
          # hwpxlib(QA(h) Phase 1) — 패키지명이 겹치지 않아 같은 engine-build/hwp에
          # 같이 넣는다. 순수 JDK 소스라 패치 불요(spike/hwpxlib/RESULT.md).
          git clone https://github.com/neolord0/hwpxlib.git hwpxlib-src
          git -C hwpxlib-src checkout "$HWPXLIB_REV"
          find hwpxlib-src/src/main/java -name '*.java' > sources-hwpx.txt
          javac -encoding UTF-8 -nowarn @sources-hwpx.txt -d engine-build/hwp
          javac -encoding UTF-8 -cp engine-build/hwp -d engine-build/hwp \
            sidecar/hwp/HwpToText.java sidecar/hwp/HwpToJson.java sidecar/hwp/JsonToHwp.java \
            sidecar/hwp/HwpxToText.java sidecar/hwp/HwpxToJson.java sidecar/hwp/JsonToHwpx.java
          jlink --add-modules java.base,java.desktop,java.xml,java.logging \
            --strip-debug --no-header-files --no-man-pages --output engine-build/jre
      - name: HWP engine smoke (bundled JRE + 한글 텍스트 샘플)
        run: |
          engine-build/jre/bin/java -cp engine-build/hwp HwpToText \
            hwplib-src/sample_hwp/big_file.hwp out.txt
          grep -qF "테스트" out.txt || { echo "::error::HWP engine smoke failed: 한글 텍스트 추출 불일치"; exit 1; }

          engine-build/jre/bin/java -cp engine-build/hwp HwpToText \
            hwplib-src/sample_hwp/merging-cell.hwp out2.txt
          grep -qF "0,0" out2.txt || { echo "::error::HWP engine smoke failed: 표 추출 불일치"; exit 1; }

          engine-build/jre/bin/java -cp engine-build/hwp HwpToJson \
            hwplib-src/sample_hwp/merging-cell.hwp out.json
          grep -qF '"type":"table"' out.json || { echo "::error::HWP engine smoke failed: HwpToJson 표 구조 불일치"; exit 1; }

          # DEC-017/DEC-028: DOCX→HWP 사이드카(JsonToHwp) — 구조 JSON → HWP 생성 → 재읽기 왕복 검증.
          # DEC-028부터 표는 더 이상 텍스트로 단순화되지 않고 실제 HWP 표
          # 컨트롤로 생성된다(spike/hwplib/SpikeTable.java에서 검증한 패턴).
          python3 <<'PY'
          import json
          def cell(text):
              return {"text": text, "colSpan": 1, "rowSpan": 1}
          blocks = {"blocks": [
              {"type": "p", "text": "뷁 밟 닳 넋 한글 생성 테스트"},
              {"type": "table", "rows": [[cell("이름"), cell("부서")], [cell("김철수"), cell("영업1팀")]]},
          ]}
          open("blocks.json", "w", encoding="utf-8").write(json.dumps(blocks, ensure_ascii=False))
          PY
          engine-build/jre/bin/java -cp engine-build/hwp JsonToHwp blocks.json created.hwp
          [ -f created.hwp ] || { echo "::error::HWP engine smoke failed: JsonToHwp가 HWP 파일을 생성하지 못함"; exit 1; }
          engine-build/jre/bin/java -cp engine-build/hwp HwpToText created.hwp created.txt
          grep -qF "뷁 밟 닳 넋 한글 생성 테스트" created.txt || { echo "::error::HWP engine smoke failed: JsonToHwp 생성 문서 재읽기 텍스트 불일치"; exit 1; }
          grep -qF "김철수" created.txt || { echo "::error::HWP engine smoke failed: JsonToHwp 표 내용 불일치"; exit 1; }

          # DEC-028: 표가 진짜 표 구조(행/열)로 만들어졌는지 HwpToJson으로 재확인 —
          # 위 HwpToText 체크는 내용만 보고 구조는 못 걸러낸다.
          engine-build/jre/bin/java -cp engine-build/hwp HwpToJson created.hwp created.json
          python3 <<'PY'
          import re, sys
          text = open("created.json", encoding="utf-8").read()
          # DEC-051부터 셀은 항상 {"runs":[...],"colSpan":n,"rowSpan":m} 객체다.
          def cell(t):
              return '{"runs":[{"text":"' + t + '","bold":false,"italic":false,"underline":false,"size":10.0,"color":"000000"}],"colSpan":1,"rowSpan":1,"align":"justify"}'
          expected = '"type":"table","rows":[[' + cell("이름") + "," + cell("부서") + "],[" + cell("김철수") + "," + cell("영업1팀") + "]]"
          if expected not in text:
              print("::error::HWP engine smoke failed: JsonToHwp가 만든 표가 실제 표 구조(2행x2열)로 재확인되지 않음(DEC-028 회귀)")
              sys.exit(1)
          PY

          # DEC-035: 셀 병합(colSpan/rowSpan) — JsonToHwp가 TableCellMerger로
          # 실제 병합을 적용하고, HwpToJson이 그 구조(병합 안 된 셀은 평문,
          # 병합된 셀은 colSpan/rowSpan 객체)를 그대로 재확인해야 한다.
          python3 -c '
          import json
          blocks = {"blocks": [{"type": "table", "rows": [
              [{"text": "병합", "colSpan": 2, "rowSpan": 1}],
              [{"text": "10", "colSpan": 1, "rowSpan": 1}, {"text": "11", "colSpan": 1, "rowSpan": 1}],
          ], "colWidthsMm": [30.0, 30.0]}]}
          open("merge-blocks.json", "w", encoding="utf-8").write(json.dumps(blocks, ensure_ascii=False))
          '
          engine-build/jre/bin/java -cp engine-build/hwp JsonToHwp merge-blocks.json merged.hwp
          [ -f merged.hwp ] || { echo "::error::HWP engine smoke failed: JsonToHwp가 병합 표를 생성하지 못함(DEC-035)"; exit 1; }
          engine-build/jre/bin/java -cp engine-build/hwp HwpToJson merged.hwp merged.json
          python3 <<'PY'
          import re, sys
          text = open("merged.json", encoding="utf-8").read()
          # DEC-051부터 셀은 항상 {"runs":[...],"colSpan":n,"rowSpan":m} 객체다
          # (문단 블록과 같은 표현, 표 셀 안 서식 보존).
          pattern = (r'"type":"table","rows":\[\[\{"runs":\[\{"text":"병합","bold":false,"italic":false,'
                     r'"underline":false,"size":10\.0,"color":"000000"\}\],"colSpan":2,"rowSpan":1,"align":"justify"\}\],'
                     r'\[\{"runs":\[\{"text":"10","bold":false,"italic":false,"underline":false,"size":10\.0,'
                     r'"color":"000000"\}\],"colSpan":1,"rowSpan":1,"align":"justify"\},\{"runs":\[\{"text":"11","bold":false,'
                     r'"italic":false,"underline":false,"size":10\.0,"color":"000000"\}\],"colSpan":1,"rowSpan":1,"align":"justify"\}\]\]')
          if not re.search(pattern, text):
              print("::error::HWP engine smoke failed: 셀 병합이 왕복 후 유지되지 않음(DEC-035 회귀)")
              sys.exit(1)
          PY

          # DEC-051: 표 셀 안 문자 서식(굵게/기울임/밑줄/크기/색상) — DEC-038이
          # 문단에 반영한 것과 대칭으로 표 셀 run에도 반영되는지.
          cat > cell-formatted-blocks.json <<'JSON'
          {"blocks":[{"type":"table","rows":[[{"runs":[{"text":"일반 "},{"text":"굵고빨강","bold":true,"color":"FF0000"}],"colSpan":1,"rowSpan":1},{"runs":[{"text":"plain"}],"colSpan":1,"rowSpan":1}]]}]}
          JSON
          engine-build/jre/bin/java -cp engine-build/hwp JsonToHwp cell-formatted-blocks.json cell-formatted.hwp
          [ -f cell-formatted.hwp ] || { echo "::error::HWP engine smoke failed: JsonToHwp가 셀 서식 있는 표를 생성하지 못함(DEC-051)"; exit 1; }
          engine-build/jre/bin/java -cp engine-build/hwp HwpToJson cell-formatted.hwp cell-formatted.json
          grep -qF '"text":"굵고빨강","bold":true,"italic":false,"underline":false,"size":10.0,"color":"FF0000"' cell-formatted.json \
            || { echo "::error::HWP engine smoke failed: 표 셀 안 굵게·색상 서식이 왕복 후 재확인되지 않음(DEC-051 회귀)"; exit 1; }
          grep -qF '"text":"일반 ","bold":false,"italic":false,"underline":false' cell-formatted.json \
            || { echo "::error::HWP engine smoke failed: 표 셀 안 서식 없는 run이 잘못된 서식으로 나옴(DEC-051 회귀)"; exit 1; }

          # DEC-053: 표 셀 안 문단 정렬(가운데/오른쪽) — DEC-040이 문단에
          # 반영한 것과 대칭으로 표 셀에도 반영되는지.
          cat > cell-aligned-blocks.json <<'JSON'
          {"blocks":[{"type":"table","rows":[[{"runs":[{"text":"가운데"}],"colSpan":1,"rowSpan":1,"align":"center"},{"runs":[{"text":"오른쪽"}],"colSpan":1,"rowSpan":1,"align":"right"}]]}]}
          JSON
          engine-build/jre/bin/java -cp engine-build/hwp JsonToHwp cell-aligned-blocks.json cell-aligned.hwp
          [ -f cell-aligned.hwp ] || { echo "::error::HWP engine smoke failed: JsonToHwp가 셀 정렬 있는 표를 생성하지 못함(DEC-053)"; exit 1; }
          engine-build/jre/bin/java -cp engine-build/hwp HwpToJson cell-aligned.hwp cell-aligned.json
          python3 <<'PY'
          import re, sys
          text = open("cell-aligned.json", encoding="utf-8").read()
          checks = [
              (r'"text":"가운데".*?"align":"center"', "표 셀 가운데 정렬이 왕복 후 재확인되지 않음"),
              (r'"text":"오른쪽".*?"align":"right"', "표 셀 오른쪽 정렬이 왕복 후 재확인되지 않음"),
          ]
          for pattern, message in checks:
              if not re.search(pattern, text):
                  print(f"::error::HWP engine smoke failed: {message}(DEC-053 회귀)")
                  sys.exit(1)
          PY

          # DEC-038: DOCX→HWP 문자 서식(굵게/기울임/밑줄/크기/색상) 반영 —
          # JsonToHwp가 run별 서식을 CharShape으로 만들어 ParaCharShape에
          # 위치별로 연결하고, HwpToJson으로 재읽었을 때 run 경계·서식이
          # 그대로 재확인되어야 한다(DEC-027은 읽기 방향만 검증했다 — 이건
          # 쓰기 방향 왕복).
          python3 -c '
          import json
          blocks = {"blocks": [{"type": "p", "runs": [
              {"text": "굵은텍스트", "bold": True},
              {"text": "일반텍스트"},
              {"text": "기울임텍스트", "italic": True, "size": 18, "color": "FF0000"},
          ]}]}
          open("formatted-blocks.json", "w", encoding="utf-8").write(json.dumps(blocks, ensure_ascii=False))
          '
          engine-build/jre/bin/java -cp engine-build/hwp JsonToHwp formatted-blocks.json formatted-created.hwp
          [ -f formatted-created.hwp ] || { echo "::error::HWP engine smoke failed: JsonToHwp가 서식 있는 문서를 생성하지 못함(DEC-038)"; exit 1; }
          engine-build/jre/bin/java -cp engine-build/hwp HwpToJson formatted-created.hwp formatted-created.json
          python3 <<'PY'
          import re, sys
          text = open("formatted-created.json", encoding="utf-8").read()
          if not re.search(r'"text":"굵은텍스트","bold":true,"italic":false,"underline":false', text):
              print("::error::HWP engine smoke failed: JsonToHwp가 쓴 굵게 서식이 왕복 후 재확인되지 않음(DEC-038 회귀)")
              sys.exit(1)
          if not re.search(r'"text":"일반텍스트","bold":false,"italic":false,"underline":false', text):
              print("::error::HWP engine smoke failed: JsonToHwp가 서식 없는 run을 잘못된 서식으로 씀(DEC-038 회귀)")
              sys.exit(1)
          if not re.search(r'"text":"기울임텍스트","bold":false,"italic":true,"underline":false,"size":18(\.0)?,"color":"FF0000"', text):
              print("::error::HWP engine smoke failed: JsonToHwp가 쓴 기울임·크기·색상 서식이 같은 run 안에서 왕복 후 재확인되지 않음(DEC-038 회귀)")
              sys.exit(1)
          PY

          # DEC-039: PDF→HWP 페이지 구분(pageBreakBefore) — JsonToHwp가 이
          # 표시가 있는 문단에만 "문단 앞에서 항상 쪽 나눔" ParaShape을
          # 걸어야 한다. HwpToText/HwpToJson 둘 다 이 속성을 안 보므로
          # PageBreakDebug(테스트 전용, 배포용 engine-build/hwp가 아닌
          # debug-tools에 컴파일)로 직접 확인한다.
          mkdir -p debug-tools
          javac -encoding UTF-8 -cp engine-build/hwp -d debug-tools sidecar/hwp/PageBreakDebug.java
          python3 -c '
          import json
          blocks = {"blocks": [
              {"type": "p", "text": "1페이지 문단"},
              {"type": "p", "text": "2페이지 문단", "pageBreakBefore": True},
          ]}
          open("pagebreak-blocks.json", "w", encoding="utf-8").write(json.dumps(blocks, ensure_ascii=False))
          '
          engine-build/jre/bin/java -cp engine-build/hwp JsonToHwp pagebreak-blocks.json pagebreak.hwp
          [ -f pagebreak.hwp ] || { echo "::error::HWP engine smoke failed: JsonToHwp가 페이지 구분 있는 문서를 생성하지 못함(DEC-039)"; exit 1; }
          engine-build/jre/bin/java -cp "debug-tools:engine-build/hwp" PageBreakDebug pagebreak.hwp pagebreak-out.txt
          grep -qF "$(printf '0\tfalse\t1페이지 문단')" pagebreak-out.txt || { echo "::error::HWP engine smoke failed: 1페이지 문단에 쪽 나눔이 잘못 붙음(DEC-039 회귀)"; exit 1; }
          grep -qF "$(printf '1\ttrue\t2페이지 문단')" pagebreak-out.txt || { echo "::error::HWP engine smoke failed: 2페이지 문단에 쪽 나눔이 반영되지 않음(DEC-039 회귀)"; exit 1; }

          # DEC-040: 문단 정렬(align) — "align"이 있는 블록은 JsonToHwp가
          # 실제 ParaShape 정렬로 반영하고, "align"이 없는 블록은 HWP 문서
          # 기본 정렬(양쪽 정렬)로 나와야 한다. HwpToJson으로 왕복 재확인.
          python3 -c '
          import json
          blocks = {"blocks": [
              {"type": "p", "text": "기본 정렬"},
              {"type": "p", "text": "가운데 정렬", "align": "center"},
              {"type": "p", "text": "오른쪽 정렬", "align": "right"},
          ]}
          open("align-blocks.json", "w", encoding="utf-8").write(json.dumps(blocks, ensure_ascii=False))
          '
          engine-build/jre/bin/java -cp engine-build/hwp JsonToHwp align-blocks.json align.hwp
          [ -f align.hwp ] || { echo "::error::HWP engine smoke failed: JsonToHwp가 정렬 있는 문서를 생성하지 못함(DEC-040)"; exit 1; }
          engine-build/jre/bin/java -cp engine-build/hwp HwpToJson align.hwp align.json
          python3 <<'PY'
          import re, sys
          text = open("align.json", encoding="utf-8").read()
          checks = [
              (r'"text":"기본 정렬".*?"align":"justify"', "정렬 미지정 문단이 HWP 기본 정렬(양쪽)로 나오지 않음"),
              (r'"text":"가운데 정렬".*?"align":"center"', "가운데 정렬이 왕복 후 재확인되지 않음"),
              (r'"text":"오른쪽 정렬".*?"align":"right"', "오른쪽 정렬이 왕복 후 재확인되지 않음"),
          ]
          for pattern, message in checks:
              if not re.search(pattern, text):
                  print(f"::error::HWP engine smoke failed: {message}(DEC-040 회귀)")
                  sys.exit(1)
          PY

          # DEC-018: 긴 문단(여러 줄로 감싸질 정도)도 텍스트가 그대로 보존되는지 —
          # LineSeg 줄바꿈 재계산이 텍스트 자체를 깨뜨리지 않는지 확인.
          python3 <<'PY'
          import json
          long_text = ("긴 문단 테스트 " * 15).strip()
          blocks = {"blocks": [{"type": "p", "text": long_text}, {"type": "p", "text": "짧은 다음 문단"}]}
          open("blocks-long.json", "w", encoding="utf-8").write(json.dumps(blocks, ensure_ascii=False))
          open("expected-long.txt", "w", encoding="utf-8").write(long_text + "\n짧은 다음 문단")
          PY
          engine-build/jre/bin/java -cp engine-build/hwp JsonToHwp blocks-long.json created-long.hwp
          engine-build/jre/bin/java -cp engine-build/hwp HwpToText created-long.hwp created-long.txt
          python3 <<'PY'
          import sys
          actual = open("created-long.txt", encoding="utf-8").read().strip()
          expected = open("expected-long.txt", encoding="utf-8").read().strip()
          if actual != expected:
              print("::error::HWP engine smoke failed: 긴 문단(줄바꿈 재계산) 재읽기 텍스트 불일치")
              sys.exit(1)
          PY

          # DEC-018 구조 검증: 텍스트 왕복만으로는 LineSeg가 문단 길이와 무관하게
          # 항상 1개·세로 위치가 모든 문단에서 0으로 고정되는 회귀를 못 잡는다 —
          # hwplib로 직접 열어 레이아웃 캐시 구조까지 확인한다. LineSegDebug는
          # 테스트 전용 도구라 배포용 engine-build/hwp가 아닌 별도 디렉터리에 컴파일한다.
          mkdir -p debug-tools
          javac -encoding UTF-8 -cp engine-build/hwp -d debug-tools sidecar/hwp/LineSegDebug.java
          engine-build/jre/bin/java -cp "debug-tools:engine-build/hwp" LineSegDebug created-long.hwp \
            > lineseg-debug.txt
          python3 <<'PY'
          import sys
          lines = open("lineseg-debug.txt", encoding="utf-8").read().splitlines()
          p0 = lines[0].split("\t")
          line_align_count0 = int(p0[1])
          if line_align_count0 <= 1:
              print(f"::error::HWP engine smoke failed: 긴 문단의 lineAlignCount={line_align_count0} — 줄바꿈 재계산이 안 됨(DEC-018 회귀)")
              sys.exit(1)
          vpos0 = [int(item.split(":")[1]) for item in p0[3].split(",")]
          if len(set(vpos0)) != line_align_count0:
              print("::error::HWP engine smoke failed: 줄마다 세로 위치가 달라야 하는데 일부가 겹침(DEC-018 회귀)")
              sys.exit(1)
          p1 = lines[1].split("\t")
          vpos1_first = int(p1[3].split(",")[0].split(":")[1])
          if vpos1_first <= vpos0[-1]:
              print("::error::HWP engine smoke failed: 다음 문단이 이전 문단 아래에서 이어지지 않음(모두 0으로 겹치는 DEC-018 회귀)")
              sys.exit(1)
          PY

          # DEC-027: HwpToJson의 문자 서식(굵게/기울임/크기/색상) 추출 검증.
          # MakeFormattedHwp도 LineSegDebug와 같은 테스트 전용 도구 —
          # 배포용 engine-build/hwp가 아닌 debug-tools에 컴파일한다.
          javac -encoding UTF-8 -cp engine-build/hwp -d debug-tools sidecar/hwp/MakeFormattedHwp.java
          engine-build/jre/bin/java -cp "debug-tools:engine-build/hwp" MakeFormattedHwp formatted.hwp
          engine-build/jre/bin/java -cp engine-build/hwp HwpToJson formatted.hwp formatted.json
          python3 <<'PY'
          import re, sys
          text = open("formatted.json", encoding="utf-8").read()
          if not re.search(r'"text":"굵은텍스트","bold":true', text):
              print("::error::HWP engine smoke failed: 굵게 서식이 추출되지 않음(DEC-027 회귀)")
              sys.exit(1)
          if not re.search(r'"text":"일반텍스트","bold":false', text):
              print("::error::HWP engine smoke failed: 같은 문단 안 일반 run이 굵게로 잘못 표시됨(DEC-027 회귀)")
              sys.exit(1)
          # [^}]*로 같은 run 객체({...} 하나) 안에서만 매치되도록 제한 — .*는 run
          # 경계를 넘어 서로 다른 run의 속성을 잘못 엮어 맞출 수 있다(코드 리뷰 지적).
          if not re.search(r'"italic":true[^}]*"size":18(\.0)?[^}]*"color":"FF0000"', text):
              print("::error::HWP engine smoke failed: 기울임·크기·색상 서식이 같은 run 안에서 함께 추출되지 않음(DEC-027 회귀)")
              sys.exit(1)
          PY
          # 외부 QA 이슈 #43: 표가 아닌 컨트롤(머리말·글상자) 안의 텍스트가
          # 조용히 사라지던 회귀 — 실사용 공공기관 문서(mois-hwpplan.hwp·
          # unikorea-contract.hwp)에서 실제로 확인된 두 중첩 패턴(머리말
          # 안의 표, 묶음 개체 안의 글상자 2개)을 합성 픽스처로 재현한다.
          javac -encoding UTF-8 -cp engine-build/hwp -d debug-tools sidecar/hwp/MakeNestedControlHwp.java
          engine-build/jre/bin/java -cp "debug-tools:engine-build/hwp" MakeNestedControlHwp nested.hwp
          engine-build/jre/bin/java -cp engine-build/hwp HwpToJson nested.hwp nested.json
          python3 <<'PY'
          import sys
          text = open("nested.json", encoding="utf-8").read()
          for expected in ('"text":"머리말텍스트"', '"셀A"', '"셀B"', '"text":"그룹A"', '"text":"그룹B"'):
              if expected not in text:
                  print(f"::error::HWP engine smoke failed: 표가 아닌 컨트롤(머리말·글상자) 텍스트 유실(#43 회귀) — {expected} 없음")
                  sys.exit(1)
          PY
      - name: HWPX engine smoke (QA(h) Phase 1 — hwpxlib 실제 샘플)
        run: |
          engine-build/jre/bin/java -cp engine-build/hwp HwpxToText \
            hwpxlib-src/testFile/tool/textextractor/multipara.hwpx hwpx_out.txt
          grep -qF "김하성" hwpx_out.txt || { echo "::error::HWPX engine smoke failed: 한글 텍스트 추출 불일치"; exit 1; }

          engine-build/jre/bin/java -cp engine-build/hwp HwpxToJson \
            hwpxlib-src/testFile/tool/textextractor/multipara.hwpx hwpx_out.json
          grep -qF '"bold":false' hwpx_out.json || { echo "::error::HWPX engine smoke failed: HwpxToJson 문단 서식 필드 누락"; exit 1; }

          engine-build/jre/bin/java -cp engine-build/hwp HwpxToJson \
            hwpxlib-src/testFile/tool/textextractor/Table.hwpx hwpx_table.json
          python3 <<'PY'
          import re, sys
          text = open("hwpx_table.json", encoding="utf-8").read()
          # DEC-051부터 셀은 항상 {"runs":[...],"colSpan":n,"rowSpan":m} 객체다.
          def cell(t):
              return '{"runs":[{"text":"' + t + '","bold":false,"italic":false,"underline":false,"size":10.0,"color":"000000"}],"colSpan":1,"rowSpan":1,"align":"center"}'
          expected = '"type":"table","rows":[[' + ",".join(cell(t) for t in ["이름", "국어", "영어", "수학"]) + "]"
          if expected not in text:
              print("::error::HWPX engine smoke failed: 표 구조 불일치")
              sys.exit(1)
          PY
      - name: HWPX header/footer/shape engine smoke (DEC-052)
        run: |
          # DEC-052: 머리말·꼬리말은 Ctrl(HeaderFooterCore) 안, 글상자는
          # 도형 RunItem(DrawingObject/Container) 안에 있어 기존
          # emitParagraph가 순회하지 않고 조용히 건너뛰었다(hwplib 쪽
          # DEC-032와 대칭인 문제) — hwpxlib 자체 테스트 픽스처로 재귀
          # 처리가 실제로 텍스트를 뽑아내는지 확인.
          engine-build/jre/bin/java -cp engine-build/hwp HwpxToJson \
            hwpxlib-src/testFile/reader_writer/HeaderFooter.hwpx hwpx_headerfooter.json
          grep -qF '머리말 테스트' hwpx_headerfooter.json || { echo "::error::HWPX engine smoke failed: 머리말 텍스트 유실(DEC-052 회귀)"; exit 1; }
          grep -qF '꼬리말' hwpx_headerfooter.json || { echo "::error::HWPX engine smoke failed: 꼬리말 텍스트 유실(DEC-052 회귀)"; exit 1; }

          engine-build/jre/bin/java -cp engine-build/hwp HwpxToJson \
            hwpxlib-src/testFile/tool/textextractor/RectInRect.hwpx hwpx_nestedshape.json
          grep -qF '사각형' hwpx_nestedshape.json || { echo "::error::HWPX engine smoke failed: 중첩 글상자 텍스트 유실(DEC-052 회귀)"; exit 1; }
      - name: HWPX write engine smoke (DOCX/PDF→HWPX 쓰기 — DEC-049)
        run: |
          # DEC-049(DEC-035 대칭): 셀 병합(colSpan/rowSpan) — JsonToHwpx가
          # sparse 표현으로 곧바로 병합된 Tc를 쓰고(TableCellMerger 같은
          # 별도 유틸 없이), HwpxToJson이 그 구조를 그대로 재확인해야 한다.
          cat > hwpx-merge-blocks.json <<'JSON'
          {"blocks":[{"type":"table","rows":[[{"text":"병합","colSpan":2,"rowSpan":1}],[{"text":"10","colSpan":1,"rowSpan":1},{"text":"11","colSpan":1,"rowSpan":1}]],"colWidthsMm":[30.0,30.0]}]}
          JSON
          engine-build/jre/bin/java -cp engine-build/hwp JsonToHwpx hwpx-merge-blocks.json hwpx-merged.hwpx
          [ -f hwpx-merged.hwpx ] || { echo "::error::HWPX write engine smoke failed: JsonToHwpx가 병합 표를 생성하지 못함(DEC-049)"; exit 1; }
          engine-build/jre/bin/java -cp engine-build/hwp HwpxToJson hwpx-merged.hwpx hwpx-merged.json
          python3 <<'PY'
          import re, sys
          text = open("hwpx-merged.json", encoding="utf-8").read()
          # DEC-051부터 셀은 항상 {"runs":[...],"colSpan":n,"rowSpan":m} 객체다.
          pattern = (r'"type":"table","rows":\[\[\{"runs":\[\{"text":"병합","bold":false,"italic":false,'
                     r'"underline":false,"size":10\.0,"color":"000000"\}\],"colSpan":2,"rowSpan":1,"align":"justify"\}\],'
                     r'\[\{"runs":\[\{"text":"10","bold":false,"italic":false,"underline":false,"size":10\.0,'
                     r'"color":"000000"\}\],"colSpan":1,"rowSpan":1,"align":"justify"\},\{"runs":\[\{"text":"11","bold":false,'
                     r'"italic":false,"underline":false,"size":10\.0,"color":"000000"\}\],"colSpan":1,"rowSpan":1,"align":"justify"\}\]\]')
          if not re.search(pattern, text):
              print("::error::HWPX write engine smoke failed: 셀 병합이 왕복 후 유지되지 않음(DEC-049 회귀)")
              sys.exit(1)
          PY
          # DEC-051: 표 셀 안 문자 서식(굵게/기울임/밑줄/크기/색상) — HWP
          # 쪽과 대칭으로 표 셀 run에도 반영되는지.
          cat > hwpx-cell-formatted-blocks.json <<'JSON'
          {"blocks":[{"type":"table","rows":[[{"runs":[{"text":"일반 "},{"text":"굵고빨강","bold":true,"color":"FF0000"}],"colSpan":1,"rowSpan":1},{"runs":[{"text":"plain"}],"colSpan":1,"rowSpan":1}]]}]}
          JSON
          engine-build/jre/bin/java -cp engine-build/hwp JsonToHwpx hwpx-cell-formatted-blocks.json hwpx-cell-formatted.hwpx
          [ -f hwpx-cell-formatted.hwpx ] || { echo "::error::HWPX write engine smoke failed: JsonToHwpx가 셀 서식 있는 표를 생성하지 못함(DEC-051)"; exit 1; }
          engine-build/jre/bin/java -cp engine-build/hwp HwpxToJson hwpx-cell-formatted.hwpx hwpx-cell-formatted.json
          grep -qF '"text":"굵고빨강","bold":true,"italic":false,"underline":false,"size":10.0,"color":"FF0000"' hwpx-cell-formatted.json \
            || { echo "::error::HWPX write engine smoke failed: 표 셀 안 굵게·색상 서식이 왕복 후 재확인되지 않음(DEC-051 회귀)"; exit 1; }
          grep -qF '"text":"일반 ","bold":false,"italic":false,"underline":false' hwpx-cell-formatted.json \
            || { echo "::error::HWPX write engine smoke failed: 표 셀 안 서식 없는 run이 잘못된 서식으로 나옴(DEC-051 회귀)"; exit 1; }
          # DEC-053: 표 셀 안 문단 정렬(가운데/오른쪽) — HWP 쪽과 대칭으로
          # 표 셀에도 반영되는지.
          cat > hwpx-cell-aligned-blocks.json <<'JSON'
          {"blocks":[{"type":"table","rows":[[{"runs":[{"text":"가운데"}],"colSpan":1,"rowSpan":1,"align":"center"},{"runs":[{"text":"오른쪽"}],"colSpan":1,"rowSpan":1,"align":"right"}]]}]}
          JSON
          engine-build/jre/bin/java -cp engine-build/hwp JsonToHwpx hwpx-cell-aligned-blocks.json hwpx-cell-aligned.hwpx
          [ -f hwpx-cell-aligned.hwpx ] || { echo "::error::HWPX write engine smoke failed: JsonToHwpx가 셀 정렬 있는 표를 생성하지 못함(DEC-053)"; exit 1; }
          engine-build/jre/bin/java -cp engine-build/hwp HwpxToJson hwpx-cell-aligned.hwpx hwpx-cell-aligned.json
          python3 <<'PY'
          import re, sys
          text = open("hwpx-cell-aligned.json", encoding="utf-8").read()
          checks = [
              (r'"text":"가운데".*?"align":"center"', "표 셀 가운데 정렬이 왕복 후 재확인되지 않음"),
              (r'"text":"오른쪽".*?"align":"right"', "표 셀 오른쪽 정렬이 왕복 후 재확인되지 않음"),
          ]
          for pattern, message in checks:
              if not re.search(pattern, text):
                  print(f"::error::HWPX write engine smoke failed: {message}(DEC-053 회귀)")
                  sys.exit(1)
          PY
          # DEC-049 머지 전 자동 리뷰 지적(재현 확인 후 수정): parseTableSpec이
          # 셀을 항상 Map으로 캐스팅해, HwpxToJson이 병합 없는 셀을 평문
          # 문자열로 내보내는 것(하위 호환, DEC-035와 동일 원칙)과 왕복이
          # 안 됐다(ClassCastException) — 문자열 셀도 받아들이는지 확인.
          cat > hwpx-string-cell-blocks.json <<'JSON'
          {"blocks":[{"type":"table","rows":[["a","b"],["c","d"]]}]}
          JSON
          engine-build/jre/bin/java -cp engine-build/hwp JsonToHwpx hwpx-string-cell-blocks.json hwpx-string-cell.hwpx
          [ -f hwpx-string-cell.hwpx ] || { echo "::error::HWPX write engine smoke failed: JsonToHwpx가 평문 문자열 셀 표를 생성하지 못함(DEC-049 회귀)"; exit 1; }
          engine-build/jre/bin/java -cp engine-build/hwp HwpxToJson hwpx-string-cell.hwpx hwpx-string-cell.json
          python3 <<'PY'
          import re, sys
          text = open("hwpx-string-cell.json", encoding="utf-8").read()
          # DEC-051부터 셀은 항상 {"runs":[...],"colSpan":n,"rowSpan":m} 객체다.
          def cell(t):
              return '{"runs":[{"text":"' + t + '","bold":false,"italic":false,"underline":false,"size":10.0,"color":"000000"}],"colSpan":1,"rowSpan":1,"align":"justify"}'
          expected = '"type":"table","rows":[[' + cell("a") + "," + cell("b") + "],[" + cell("c") + "," + cell("d") + "]]"
          if expected not in text:
              print("::error::HWPX write engine smoke failed: 평문 문자열 셀 표가 왕복 후 유지되지 않음(DEC-049 회귀)")
              sys.exit(1)
          PY
          # DEC-049(DEC-038 대칭): 문자 서식(굵게/기울임/크기/색상).
          cat > hwpx-formatted-blocks.json <<'JSON'
          {"blocks":[{"type":"p","runs":[{"text":"굵은텍스트","bold":true},{"text":"일반텍스트"},{"text":"기울임텍스트","italic":true,"size":18,"color":"FF0000"}]}]}
          JSON
          engine-build/jre/bin/java -cp engine-build/hwp JsonToHwpx hwpx-formatted-blocks.json hwpx-formatted.hwpx
          [ -f hwpx-formatted.hwpx ] || { echo "::error::HWPX write engine smoke failed: JsonToHwpx가 서식 있는 문서를 생성하지 못함(DEC-049)"; exit 1; }
          engine-build/jre/bin/java -cp engine-build/hwp HwpxToJson hwpx-formatted.hwpx hwpx-formatted.json
          grep -qF '"text":"굵은텍스트","bold":true,"italic":false,"underline":false' hwpx-formatted.json \
            || { echo "::error::HWPX write engine smoke failed: JsonToHwpx가 쓴 굵게 서식이 왕복 후 재확인되지 않음(DEC-049 회귀)"; exit 1; }
          grep -qF '"text":"일반텍스트","bold":false,"italic":false,"underline":false' hwpx-formatted.json \
            || { echo "::error::HWPX write engine smoke failed: JsonToHwpx가 서식 없는 run을 잘못된 서식으로 씀(DEC-049 회귀)"; exit 1; }
          python3 <<'PY'
          import re, sys
          text = open("hwpx-formatted.json", encoding="utf-8").read()
          if not re.search(r'"italic":true[^}]*"size":18(\.0)?[^}]*"color":"FF0000"', text):
              print("::error::HWPX write engine smoke failed: 기울임·크기·색상 서식이 같은 run 안에서 왕복 후 재확인되지 않음(DEC-049 회귀)")
              sys.exit(1)
          PY
          # DEC-049(DEC-040 대칭): 문단 정렬.
          cat > hwpx-align-blocks.json <<'JSON'
          {"blocks":[{"type":"p","text":"기본 정렬"},{"type":"p","text":"가운데 정렬","align":"center"},{"type":"p","text":"오른쪽 정렬","align":"right"}]}
          JSON
          engine-build/jre/bin/java -cp engine-build/hwp JsonToHwpx hwpx-align-blocks.json hwpx-align.hwpx
          engine-build/jre/bin/java -cp engine-build/hwp HwpxToJson hwpx-align.hwpx hwpx-align.json
          python3 <<'PY'
          import re, sys
          text = open("hwpx-align.json", encoding="utf-8").read()
          checks = [
              (r'"text":"기본 정렬".*?"align":"justify"', "정렬 미지정 문단이 기본 정렬(양쪽)로 나오지 않음"),
              (r'"text":"가운데 정렬".*?"align":"center"', "가운데 정렬이 왕복 후 재확인되지 않음"),
              (r'"text":"오른쪽 정렬".*?"align":"right"', "오른쪽 정렬이 왕복 후 재확인되지 않음"),
          ]
          for pattern, msg in checks:
              if not re.search(pattern, text):
                  print(f"::error::HWPX write engine smoke failed: {msg}(DEC-049 회귀)")
                  sys.exit(1)
          PY
          # DEC-049(DEC-039 대칭): 쪽 나눔(pageBreakBefore) — HwpxToJson 정식
          # 스키마는 이 값을 안 보므로(HWP와 동일한 이유) PageBreakDebugHwpx
          # (테스트 전용, 배포용 engine-build/hwp가 아닌 debug-tools에 컴파일)로
          # 직접 확인한다.
          mkdir -p debug-tools
          javac -encoding UTF-8 -cp engine-build/hwp -d debug-tools sidecar/hwp/PageBreakDebugHwpx.java
          cat > hwpx-pagebreak-blocks.json <<'JSON'
          {"blocks":[{"type":"p","text":"1페이지 문단"},{"type":"p","text":"2페이지 문단","pageBreakBefore":true}]}
          JSON
          engine-build/jre/bin/java -cp engine-build/hwp JsonToHwpx hwpx-pagebreak-blocks.json hwpx-pagebreak.hwpx
          [ -f hwpx-pagebreak.hwpx ] || { echo "::error::HWPX write engine smoke failed: JsonToHwpx가 페이지 구분 있는 문서를 생성하지 못함(DEC-049)"; exit 1; }
          engine-build/jre/bin/java -cp "debug-tools:engine-build/hwp" PageBreakDebugHwpx hwpx-pagebreak.hwpx hwpx-pagebreak-out.txt
          grep -qF "$(printf '0\tfalse\t1페이지 문단')" hwpx-pagebreak-out.txt || { echo "::error::HWPX write engine smoke failed: 1페이지 문단에 쪽 나눔이 잘못 붙음(DEC-049 회귀)"; exit 1; }
          grep -qF "$(printf '1\ttrue\t2페이지 문단')" hwpx-pagebreak-out.txt || { echo "::error::HWPX write engine smoke failed: 2페이지 문단에 쪽 나눔이 반영되지 않음(DEC-049 회귀)"; exit 1; }
      - name: Restore LibreOffice installer cache
        id: lo-cache
        uses: actions/cache/restore@v4
        with:
          path: lo-installer
          key: libreoffice-installer-${{ env.LO_VERSION }}-${{ env.LO_MAC_SHA256 }}-mac-aarch64
      - name: Download + verify LibreOffice installer (고정 버전·SHA256)
        run: |
          mkdir -p lo-installer
          dmg="lo-installer/LibreOffice.dmg"
          if [ ! -f "$dmg" ]; then
            url="https://download.documentfoundation.org/libreoffice/stable/${LO_VERSION}/mac/aarch64/LibreOffice_${LO_VERSION}_MacOS_aarch64.dmg"
            curl -fsSL -o "$dmg" "$url"
          fi
          hash=$(shasum -a 256 "$dmg" | awk '{print $1}')
          if [ "$hash" != "$LO_MAC_SHA256" ]; then
            echo "::error::LibreOffice 설치파일 체크섬 불일치: $hash (기대값 $LO_MAC_SHA256)"
            rm -f "$dmg"
            exit 1
          fi
          echo "체크섬 확인 완료: $hash"
      - name: Save LibreOffice installer cache
        # 체크섬 검증 직후, 이후 단계 성공 여부와 무관하게 바로 저장한다 —
        # actions/cache@v4의 기본 동작(잡 전체가 성공해야만 저장)에 맡기면
        # 다운로드 이후 단계에서 실패할 때마다 무거운 dmg를 mirror 서버에서
        # 매번 다시 받아야 한다(공식 권장 restore+save 분리 패턴).
        if: steps.lo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: lo-installer
          key: ${{ steps.lo-cache.outputs.cache-primary-key }}
      - name: Extract LibreOffice (dmg 마운트 → .app에서 필요한 파일만 복사, 시스템 설치 없이)
        run: |
          mountpoint="$PWD/lo-mount"
          mkdir -p "$mountpoint"
          hdiutil attach lo-installer/LibreOffice.dmg -nobrowse -mountpoint "$mountpoint"
          app=$(find "$mountpoint" -maxdepth 1 -name "*.app" | head -n1)
          if [ -z "$app" ]; then
            echo "::error::dmg 안에서 LibreOffice.app을 찾을 수 없습니다"
            hdiutil detach "$mountpoint" || true
            exit 1
          fi
          mkdir -p engine-build/libreoffice
          cp -R "$app" engine-build/libreoffice/LibreOffice.app
          hdiutil detach "$mountpoint"
          if [ ! -f "engine-build/libreoffice/LibreOffice.app/Contents/MacOS/soffice" ]; then
            echo "::error::정규화 경로(engine-build/libreoffice/LibreOffice.app/Contents/MacOS/soffice)에 파일이 없습니다"
            exit 1
          fi
          mkdir -p engine-build/licenses/libreoffice
          cp "engine-build/libreoffice/LibreOffice.app/Contents/Resources/LICENSE" engine-build/licenses/libreoffice/ 2>/dev/null || true
          cp "engine-build/libreoffice/LibreOffice.app/Contents/Resources/LICENSE.html" engine-build/licenses/libreoffice/ 2>/dev/null || true
          cp "engine-build/libreoffice/LibreOffice.app/Contents/Resources/NOTICE" engine-build/licenses/libreoffice/ 2>/dev/null || true
          if [ -z "$(ls -A engine-build/licenses/libreoffice 2>/dev/null)" ]; then
            echo "::error::LibreOffice 라이선스 파일을 찾을 수 없습니다"
            exit 1
          fi
      - name: Restore Noto Sans KR font cache
        id: notokr-cache
        uses: actions/cache/restore@v4
        with:
          path: notokr.zip
          key: notosanskr-${{ env.NOTOKR_RELEASE_TAG }}-${{ env.NOTOKR_SHA256 }}
      - name: 한글 글꼴 번들 (Noto Sans KR — DEC-015)
        run: |
          if [ ! -f notokr.zip ]; then
            url="https://github.com/notofonts/noto-cjk/releases/download/${NOTOKR_RELEASE_TAG}/17_NotoSansKR.zip"
            curl -fsSL -o notokr.zip "$url"
          fi
          hash=$(shasum -a 256 notokr.zip | awk '{print $1}')
          if [ "$hash" != "$NOTOKR_SHA256" ]; then
            echo "::error::Noto Sans KR 체크섬 불일치: $hash (기대값 $NOTOKR_SHA256)"
            rm -f notokr.zip
            exit 1
          fi
          font_dir="engine-build/libreoffice/LibreOffice.app/Contents/Resources/fonts/truetype"
          mkdir -p "$font_dir"
          unzip -o notokr.zip -d notokr-extract
          cp notokr-extract/NotoSansKR-Regular.otf "$font_dir/"
          cp notokr-extract/NotoSansKR-Bold.otf "$font_dir/"
          mkdir -p engine-build/licenses/notosanskr
          cp notokr-extract/LICENSE engine-build/licenses/notosanskr/LICENSE.txt
          if [ ! -f "$font_dir/NotoSansKR-Regular.otf" ]; then
            echo "::error::글꼴 번들 실패: $font_dir/NotoSansKR-Regular.otf 없음"
            exit 1
          fi
      - name: Save Noto Sans KR font cache
        if: steps.notokr-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: notokr.zip
          key: ${{ steps.notokr-cache.outputs.cache-primary-key }}
      - name: LibreOffice + HWP→PDF 파이프라인 스모크 (사전 빌드 경로, 영상 섹션은 미번들이라 스킵)
        env:
          FILECONV_SOFFICE: engine-build/libreoffice/LibreOffice.app/Contents/MacOS/soffice
          FILECONV_JAVA: engine-build/jre/bin/java
          FILECONV_HWP_CLASSPATH: engine-build/hwp
        run: |
          python3 scripts/smoke_pdf_pipeline.py hwplib-src/sample_hwp/basic/표.hwp --skip-video
      - name: Build app
        run: >
          pyinstaller --noconfirm --clean --windowed --name FileConverter
          --icon packaging/icon.icns --collect-submodules app run.py
      - name: Bundle engine into dist (+ 제3자 라이선스 고지)
        run: |
          # app/bundle.py의 engine_dir()는 sys.executable(=.../Contents/MacOS/FileConverter)
          # 옆의 engine/을 찾는다 — Windows의 "exe 옆 engine/"과 동일한 원칙을
          # macOS 앱 번들 구조에 그대로 적용한 것(Contents/Resources가 아님).
          target="dist/FileConverter.app/Contents/MacOS"
          cp -R engine-build "$target/engine"
          mkdir -p "$target/engine/licenses"
          cp hwplib-src/license.txt "$target/engine/licenses/hwplib-LICENSE.txt"
          cp hwpxlib-src/license.txt "$target/engine/licenses/hwpxlib-LICENSE.txt"
          cp packaging/THIRD_PARTY_NOTICES.txt "$target/THIRD_PARTY_NOTICES.txt"
          # app/version.py가 배포판(frozen)에서 실행 파일 옆의 이 파일로 현재
          # 버전을 읽는다(OQ-002 업데이트 확인 기능 — DEC-022).
          cp packaging/VERSION "$target/VERSION"
      - name: Verify bundled artifact (엔진 실행·라이선스 확인)
        run: |
          target="dist/FileConverter.app/Contents/MacOS"
          if [ ! -d "$target/engine/licenses/libreoffice" ]; then
            echo "::error::LibreOffice 라이선스 파일이 아티팩트에 없습니다"; exit 1
          fi
          if [ ! -f "$target/engine/licenses/hwpxlib-LICENSE.txt" ]; then
            echo "::error::hwpxlib 라이선스 파일이 아티팩트에 없습니다 (QA(h) Phase 1)"; exit 1
          fi
          if [ ! -f "$target/engine/libreoffice/LibreOffice.app/Contents/Resources/fonts/truetype/NotoSansKR-Regular.otf" ]; then
            echo "::error::Noto Sans KR 글꼴이 아티팩트에 없습니다 (DEC-015)"; exit 1
          fi
          if [ ! -f "$target/engine/licenses/notosanskr/LICENSE.txt" ]; then
            echo "::error::Noto Sans KR 라이선스 파일이 아티팩트에 없습니다"; exit 1
          fi
          # PyInstaller macOS 앱 번들은 수집한 파이썬 패키지를 Contents/MacOS가
          # 아니라 Contents/Frameworks에 둔다(Windows onedir의 밋밋한 구조와
          # 다른 macOS 고유 관례 — 실제 아티팩트 트리를 직접 확인해 발견).
          if ! find dist/FileConverter.app/Contents -type d -name "PIL" | grep -q .; then
            echo "::error::Pillow(PIL) 패키지가 패키징된 아티팩트에 없습니다 (DEC-025) — PyInstaller가 lazy import를 놓쳤을 수 있음"; exit 1
          fi
          if ! find dist/FileConverter.app/Contents -iname "pypdfium2*" | grep -q .; then
            echo "::error::pypdfium2 패키지가 패키징된 아티팩트에 없습니다 (DEC-025) — PyInstaller가 lazy import를 놓쳤을 수 있음"; exit 1
          fi
          if ! find dist/FileConverter.app/Contents -type d -name "pptx" | grep -q .; then
            echo "::error::python-pptx 패키지가 패키징된 아티팩트에 없습니다 (DEC-030) — PyInstaller가 lazy import를 놓쳤을 수 있음"; exit 1
          fi
          bundled_version=$(cat "$target/VERSION")
          repo_version=$(cat packaging/VERSION)
          if [ "$bundled_version" != "$repo_version" ]; then
            echo "::error::번들된 VERSION이 packaging/VERSION과 다릅니다(업데이트 확인 기능 오탐 위험) — 번들: '$bundled_version'"; exit 1
          fi
          # 패키징 후 실제 배포 경로에서 사이드카 실행 검증
          "$target/engine/jre/bin/java" -cp "$target/engine/hwp" HwpToText \
            hwplib-src/sample_hwp/merging-cell.hwp out3.txt
          grep -qF "0,0" out3.txt || { echo "::error::패키징 경로 사이드카 스모크 실패"; exit 1; }
          # 환경변수 없이 --frozen-exe로 실제 FileConverter 실행 시나리오를 흉내내
          # engine_dir() 자동 탐색(app/bundle.py)이 진짜로 엔진을 찾는지 검증한다.
          python3 scripts/smoke_pdf_pipeline.py hwplib-src/sample_hwp/basic/표.hwp \
            --skip-video --frozen-exe dist/FileConverter.app/Contents/MacOS/FileConverter
      - name: Smoke run (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          dist/FileConverter.app/Contents/MacOS/FileConverter &
          pid=$!
          sleep 8
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "::error::app exited early"; exit 1
          fi
          kill "$pid"
          wait "$pid" 2>/dev/null || true
      - name: Build dmg (드래그 설치 방식 — Windows Inno Setup 인스톨러에 대응, REQ-NF-006)
        run: |
          version=$(cat packaging/VERSION | tr -d '[:space:]')
          staging="dmg-staging"
          mkdir -p "$staging"
          cp -R dist/FileConverter.app "$staging/FileConverter.app"
          ln -s /Applications "$staging/Applications"
          mkdir -p packaging/installer-out
          out="packaging/installer-out/FileConverter-${version}-mac-arm64.dmg"
          hdiutil create -volname "FileConverter ${version}" -srcfolder "$staging" -ov -format UDZO "$out"
          if [ ! -f "$out" ]; then
            echo "::error::dmg 생성 실패: $out 없음"; exit 1
          fi
          echo "빌드됨: $out ($(du -m "$out" | cut -f1) MB)"
      - name: dmg 설치 스모크 (마운트→설치(복사)→실행→삭제(제거) 전 과정 검증)
        run: |
          version=$(cat packaging/VERSION | tr -d '[:space:]')
          dmg="packaging/installer-out/FileConverter-${version}-mac-arm64.dmg"
          mountpoint="$PWD/dmg-smoke-mount"
          mkdir -p "$mountpoint"
          hdiutil attach "$dmg" -nobrowse -mountpoint "$mountpoint"
          installdir="$PWD/dmg-smoke-target"
          mkdir -p "$installdir"
          cp -R "$mountpoint/FileConverter.app" "$installdir/FileConverter.app"
          hdiutil detach "$mountpoint"
          installedexe="$installdir/FileConverter.app/Contents/MacOS/FileConverter"
          if [ ! -f "$installedexe" ]; then
            echo "::error::설치 후 FileConverter 실행 파일이 없습니다: $installedexe"; exit 1
          fi
          if [ ! -f "$installdir/FileConverter.app/Contents/MacOS/engine/libreoffice/LibreOffice.app/Contents/MacOS/soffice" ]; then
            echo "::error::설치된 위치에 번들 엔진이 없습니다"; exit 1
          fi
          echo "설치 확인 완료: $installedexe"

          export QT_QPA_PLATFORM=offscreen
          "$installedexe" &
          pid=$!
          sleep 8
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "::error::설치된 앱 실행 실패"; exit 1
          fi
          kill "$pid"
          wait "$pid" 2>/dev/null || true

          rm -rf "$installdir"
          if [ -d "$installdir" ]; then
            echo "::error::제거 후에도 설치 폴더가 남아 있습니다"; exit 1
          fi
          echo "제거 확인 완료"
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: FileConverter-macos-app
          path: dist/FileConverter.app
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: FileConverter-macos-dmg
          path: packaging/installer-out/*.dmg

  publish-release:
    # Windows/macOS 두 잡이 병렬로 빌드하되, 같은 GitHub Release에 자산을
    # 함께 올려야 하므로(태그당 릴리스 1개) 발행만 이 잡으로 분리해 두
    # 잡 모두를 기다린다 — 두 잡이 각자 gh release create를 부르면 경쟁
    # 상태로 하나가 "이미 존재함" 에러로 실패할 수 있어 이렇게 나눴다.
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: FileConverter-windows-installer
          path: windows-installer
      - uses: actions/download-artifact@v4
        with:
          name: FileConverter-macos-dmg
          path: macos-dmg
      - name: Publish GitHub Release (태그 push에서만 — v*.exe/v*.dmg README 다운로드 링크의 실제 소스)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          win_exe=$(find windows-installer -name '*.exe' | head -n1)
          mac_dmg=$(find macos-dmg -name '*.dmg' | head -n1)
          # 파일명이 고정된 사본도 함께 올린다(README 등에서 참조하기 쉽도록).
          # 주의: GitHub의 releases/latest/download/... 단축 URL은 pre-release를
          # "latest"로 인정하지 않는다 — 0.x라 --prerelease로 발행하는 한 이 단축
          # URL은 쓸 수 없다. README는 태그가 박힌 직접 링크를 쓰고 버전 태그 시
          # 함께 갱신한다.
          win_latest="windows-installer/FileConverter-Setup-latest.exe"
          cp "$win_exe" "$win_latest"
          mac_latest="macos-dmg/FileConverter-latest-mac-arm64.dmg"
          cp "$mac_dmg" "$mac_latest"
          gh release create "${{ github.ref_name }}" "$win_exe" "$win_latest" "$mac_dmg" "$mac_latest" \
            --repo "${{ github.repository }}" \
            --title "File Converter ${{ github.ref_name }}" \
            --notes "Windows 인스톨러(관리자 권한 불요) · macOS(Apple Silicon 전용, 미서명 — 실행 시 control+클릭 → 열기 필요, 영상 변환 미지원). 자세한 내용: README.md · docs/06_open_questions.md" \
            --prerelease
